<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الموظفين | مكرونجي</title>
<link rel="icon" href="img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--brown:#8e2a4a;--dark:#5a1830;--gold:#e0912f;--gold2:#f2b95f;--cream:#faf3ea;--card:#fffdf9;--ink:#2b1a15;--muted:#8a6f63;--line:#eadfd2;--ok:#1e5b4f;--err:#b91c1c;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;padding-bottom:3rem}
.top{background:var(--dark);color:#fff;padding:1rem;text-align:center}
.top b{font-size:1.05rem;font-weight:900}
.top small{display:block;color:var(--gold2);font-size:.72rem;font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:1.1rem;margin-bottom:1rem}
.card h3{font-size:.95rem;font-weight:900;color:var(--brown);margin-bottom:.8rem}
.f{margin-bottom:.7rem}
.f label{display:block;font-size:.78rem;font-weight:900;color:var(--brown);margin-bottom:.3rem}
.f input,.f select{width:100%;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:.9rem;font-weight:700;background:#fff;outline:none}
.f input:focus,.f select:focus{border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.btn{width:100%;border:none;border-radius:12px;padding:.85rem;font-family:inherit;font-size:.95rem;font-weight:900;cursor:pointer}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark)}
.btn-ok{background:var(--ok);color:#fff}
.btn-sm{width:auto;padding:.4rem .8rem;font-size:.75rem;border-radius:10px}
.btn-err{background:#fee2e2;color:var(--err)}
.btn-plain{background:#f3e7d7;color:var(--brown)}
.hint{font-size:.7rem;color:var(--muted);font-weight:700;line-height:1.7;margin-top:.5rem}
.result{display:none;background:#dcf5e8;border:1.5px solid #128c5e44;border-radius:12px;padding:.8rem;margin-top:.8rem;font-size:.82rem;font-weight:800;line-height:1.9}
.result .pass{direction:ltr;display:inline-block;background:var(--dark);color:var(--gold2);border-radius:8px;padding:.15rem .7rem;font-weight:900}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th,td{border:1px solid var(--line);padding:.45rem .35rem;text-align:center;font-weight:800}
th{background:#f3e7d7;color:var(--brown)}
.badge-off{background:#fee2e2;color:var(--err);border-radius:50px;padding:.1rem .5rem;font-size:.68rem}
.badge-on{background:#dcf5e8;color:var(--ok);border-radius:50px;padding:.1rem .5rem;font-size:.68rem}
#toast{position:fixed;bottom:1rem;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:.4rem;z-index:99;pointer-events:none}
.toast{background:var(--dark);color:#fff;border-radius:50px;padding:.6rem 1.3rem;font-weight:900;font-size:.82rem;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.err{background:var(--err)} .toast.ok{background:var(--ok)}
</style>
</head>
<body>

<div class="top">
  <b> مكرونجي — إدارة الموظفين</b>
  <small>تعيين المشرفين والسائقين لكل الفروع</small>
</div>

<div class="wrap">

  <!-- الاتصال -->
  <div class="card" id="connectBox">
    <h3>🔐 اتصال المالك</h3>
    <div class="f">
      <label>توكن GitHub (نفس توكن لوحة التحكم)</label>
      <input type="password" id="ghToken" dir="ltr" placeholder="ghp_... أو github_pat_...">
    </div>
    <button class="btn btn-gold" onclick="connect()">اتصال</button>
    <div class="hint">يُستخدم للتحقق من هويتك كمالك فقط — لا يُخزَّن في أي مكان.</div>
  </div>

  <!-- إضافة موظف -->
  <div class="card" id="addBox" style="display:none">
    <h3>➕ إضافة مشرف / سائق</h3>
    <div class="f"><label>الاسم الكامل</label><input id="uName" placeholder="مثال: خالد أحمد"></div>
    <div class="row2">
      <div class="f"><label>رقم الجوال</label><input id="uPhone" dir="ltr" placeholder="9665xxxxxxxx"></div>
      <div class="f"><label>اسم المستخدم</label><input id="uUser" dir="ltr" placeholder="sup.badiah"></div>
    </div>
    <div class="row2">
      <div class="f"><label>الدور</label>
        <select id="uRole">
          <option value="supervisor">مشرف فرع</option>
          <option value="driver">سائق</option>
        </select>
      </div>
      <div class="f"><label>الفرع</label><select id="uBranch"></select></div>
    </div>
    <div class="f"><label>كلمة المرور المؤقتة</label>
      <div style="display:flex;gap:.5rem">
        <input id="uPass" dir="ltr" placeholder="اتركها فارغة للتوليد التلقائي">
        <button class="btn btn-plain btn-sm" style="width:auto" onclick="genPass()">🎲 توليد</button>
      </div>
    </div>
    <button class="btn btn-ok" onclick="addUser()">✅ إنشاء الحساب</button>
    <div class="result" id="addResult"></div>
    <div class="hint">⚠️ سلّم كلمة المرور المؤقتة للموظف فوراً — عند أول دخول سيُجبر على تغييرها ولن تظهر مرة أخرى.</div>
  </div>

  <!-- قائمة الموظفين -->
  <div class="card" id="listBox" style="display:none">
    <h3>👥 الموظفون الحاليون</h3>
    <div style="overflow-x:auto"><table id="usersTable"></table></div>
    <div class="result" id="actResult"></div>
  </div>

</div>
<div id="toast"></div>

<script>
const API_BASE = 'https://makaronjy-api.makaronjy.workers.dev';
let JWT = sessionStorage.getItem('mk_tools_jwt') || '';
let BRANCHES = [];

function toast(m, k){
  const t = document.createElement('div');
  t.className = 'toast ' + (k || '');
  t.textContent = m;
  document.getElementById('toast').appendChild(t);
  setTimeout(()=> t.remove(), 3000);
}

/* سحب الفروع من settings.js مباشرة */
(function loadBranches(){
  const FALLBACK = [
    {id:'b-badiah', nameAr:'فرع البديعة'},
    {id:'b-malqa', nameAr:'فرع الملقا'},
    {id:'b-yasmeen', nameAr:'فرع الياسمين'},
    {id:'b-suwaidi', nameAr:'فرع السويدي الغربي'},
    {id:'b-rawabi', nameAr:'فرع الروابي'}
  ];
  fetch('settings.js').then(r=> r.text()).then(t=>{
    const w = {};
    try{ new Function('window', t)(w); }catch(e){}
    BRANCHES = (w.APP_SETTINGS && w.APP_SETTINGS.branches) || FALLBACK;
    renderBranchSelect();
  }).catch(()=>{ BRANCHES = FALLBACK; renderBranchSelect(); });
})();
function renderBranchSelect(){
  document.getElementById('uBranch').innerHTML =
    BRANCHES.map(b=> '<option value="'+b.id+'">'+b.nameAr+'</option>').join('');
}

function genPass(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  let p = 'Mk@';
  for(let i=0;i<8;i++) p += chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('uPass').value = p;
}

async function api(path, opts){
  const headers = { 'Content-Type':'application/json' };
  if(JWT) headers['Authorization'] = 'Bearer ' + JWT;
  const r = await fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  const data = await r.json().catch(()=> ({}));
  if(!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

async function connect(){
  const token = document.getElementById('ghToken').value.trim();
  if(!token){ toast('⚠️ أدخل التوكن', 'err'); return; }
  try{
    const d = await api('/api/auth/admin-bridge', {
      method:'POST', body: JSON.stringify({ github_token: token })
    });
    JWT = d.token;
    sessionStorage.setItem('mk_tools_jwt', JWT);
    document.getElementById('connectBox').style.display = 'none';
    document.getElementById('addBox').style.display = '';
    document.getElementById('listBox').style.display = '';
    toast('✅ تم الاتصال: ' + d.user.name, 'ok');
    loadUsers();
  }catch(e){ toast('⚠️ ' + e.message, 'err'); }
}

async function addUser(){
  const name = document.getElementById('uName').value.trim();
  const phone = document.getElementById('uPhone').value.trim();
  const username = document.getElementById('uUser').value.trim().toLowerCase();
  const role = document.getElementById('uRole').value;
  const branch_id = document.getElementById('uBranch').value;
  let password = document.getElementById('uPass').value.trim();
  if(!name || !username){ toast('⚠️ الاسم واسم المستخدم مطلوبان', 'err'); return; }
  if(!password){ genPass(); password = document.getElementById('uPass').value; }
  try{
    const d = await api('/api/admin/users', {
      method:'POST',
      body: JSON.stringify({ name, phone, username, password, role, branch_id })
    });
    const box = document.getElementById('addResult');
    box.style.display = 'block';
    box.innerHTML = '✅ تم إنشاء الحساب بنجاح<br>' +
      '👤 اسم المستخدم: <b dir="ltr">' + d.username + '</b><br>' +
      '🔑 كلمة المرور المؤقتة: <span class="pass">' + d.temp_password + '</span><br>' +
      '📍 صفحة دخول الموظف: <b dir="ltr">login.html</b>';
    document.getElementById('uName').value = '';
    document.getElementById('uPhone').value = '';
    document.getElementById('uUser').value = '';
    document.getElementById('uPass').value = '';
    loadUsers();
  }catch(e){ toast('⚠️ ' + e.message, 'err'); }
}

const ROLE_AR = { super_admin:'👑 مالك', supervisor:'👨‍💼 مشرف', driver:'🚗 سائق' };

async function loadUsers(){
  try{
    const d = await api('/api/admin/users');
    const rows = d.users.map(u=>
      '<tr><td>' + u.name + '</td><td dir="ltr">' + u.username + '</td><td>' + (ROLE_AR[u.role]||u.role) + '</td><td>' +
      (u.branch_name || '—') + '</td><td>' +
      (u.is_active ? '<span class="badge-on">نشط</span>' : '<span class="badge-off">معطل</span>') + '</td>' +
      '<td><button class="btn btn-sm ' + (u.is_active?'btn-err':'btn-ok') + '" onclick="toggleUser(' + u.id + ',' + (u.is_active?0:1) + ')">' + (u.is_active?'تعطيل':'تفعيل') + '</button> ' +
      '<button class="btn btn-sm btn-plain" onclick="resetPass(' + u.id + ')">🔑</button></td></tr>'
    ).join('');
    document.getElementById('usersTable').innerHTML =
      '<tr><th>الاسم</th><th>المستخدم</th><th>الدور</th><th>الفرع</th><th>الحالة</th><th>إجراءات</th></tr>' + rows;
  }catch(e){ toast('⚠️ ' + e.message, 'err'); }
}

async function toggleUser(id, active){
  try{
    await api('/api/admin/users/' + id, { method:'PUT', body: JSON.stringify({ is_active: active }) });
    toast(active ? '✅ تم التفعيل' : '⛔ تم التعطيل', 'ok');
    loadUsers();
  }catch(e){ toast('⚠️ ' + e.message, 'err'); }
}

async function resetPass(id){
  if(!confirm('سيتم توليد كلمة مرور مؤقتة جديدة — متابعة؟')) return;
  try{
    const d = await api('/api/admin/users/' + id + '/reset-password', { method:'POST' });
    const box = document.getElementById('actResult');
    box.style.display = 'block';
    box.innerHTML = '🔑 كلمة المرور المؤقتة لـ <b dir="ltr">' + d.username + '</b>: <span class="pass">' + d.temp_password + '</span>';
  }catch(e){ toast('⚠️ ' + e.message, 'err'); }
}

/* استعادة الجلسة إن وجدت */
if(JWT){
  api('/api/admin/users').then(()=>{
    document.getElementById('connectBox').style.display = 'none';
    document.getElementById('addBox').style.display = '';
    document.getElementById('listBox').style.display = '';
    loadUsers();
  }).catch(()=>{ JWT=''; sessionStorage.removeItem('mk_tools_jwt'); });
}
</script>
</body>
</html>
