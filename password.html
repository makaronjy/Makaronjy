<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تغيير كلمة المرور | مكرونجي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--amber:#C2571B;--tomato:#D63A2F;--basil:#2E7D4F;--ink:#2A1A10;--muted:#7A6A55;--line:#EAD9BE;--card:#FFFBF4;--dough:#FAF3E7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',Tahoma,sans-serif;background:radial-gradient(900px 500px at 85% -10%,rgba(233,161,59,.18),transparent 60%),var(--dough);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;line-height:1.6}
.card{width:100%;max-width:430px;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:26px 22px;box-shadow:0 14px 40px rgba(154,63,15,.12)}
h1{font-size:1.3rem;font-weight:900;text-align:center}
.sub{color:var(--muted);font-size:.8rem;text-align:center;margin:4px 0 18px}
.field{margin-bottom:12px}
label{display:block;font-size:.78rem;font-weight:800;margin-bottom:5px}
.wrap{position:relative}
input{width:100%;padding:12px 14px;font-size:16px;font-family:inherit;font-weight:700;border:1.5px solid var(--line);border-radius:13px;background:#fff;outline:none}
input:focus{border-color:var(--amber);box-shadow:0 0 0 4px rgba(194,87,27,.14)}
.eye{position:absolute;left:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:6px}
.rules{background:#fff;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 14px;font-size:.74rem;font-weight:700;color:var(--muted)}
.rules div{display:flex;gap:7px;align-items:center;padding:2px 0}
.rules .ok{color:var(--basil)}
.btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--amber),var(--tomato));color:#fff;font-family:inherit;font-weight:900;font-size:1rem;cursor:pointer;box-shadow:0 6px 18px rgba(214,58,47,.28)}
.btn:disabled{opacity:.6}
.msg{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.82rem;font-weight:800}
.msg.err{display:block;background:#FDECEA;color:#B3261E;border:1.5px solid #F0C4C0}
.msg.ok{display:block;background:#E5F3EA;color:#1F5C38;border:1.5px solid #BFE0CB}
</style>
</head>
<body>
<div class="card">
  <h1>🔐 تغيير كلمة مرور المالك</h1>
  <div class="sub">أداة لمرة واحدة — احذف هذا الملف بعد النجاح</div>
  <div class="field"><label>اسم المستخدم</label><input id="u" type="text" value="owner" autocapitalize="off"></div>
  <div class="field"><label>كلمة المرور الحالية</label><div class="wrap"><input id="cur" type="password"><button class="eye" data-t="cur">👁</button></div></div>
  <div class="field"><label>كلمة المرور الجديدة</label><div class="wrap"><input id="nw" type="password"><button class="eye" data-t="nw">👁</button></div></div>
  <div class="field"><label>تأكيد كلمة المرور الجديدة</label><div class="wrap"><input id="cf" type="password"><button class="eye" data-t="cf">👁</button></div></div>
  <div class="rules" id="rules">
    <div id="r1">• 8 أحرف على الأقل</div>
    <div id="r2">• حرف كبير (A-Z)</div>
    <div id="r3">• حرف صغير (a-z)</div>
    <div id="r4">• رقم (0-9)</div>
    <div id="r5">• التأكيد مطابق</div>
  </div>
  <button class="btn" id="go">تغيير كلمة المرور</button>
  <div class="msg" id="msg"></div>
</div>
<script>
var API='https://makaronjy-api.makaronjy.workers.dev';
function $(id){return document.getElementById(id);}
document.querySelectorAll('.eye').forEach(function(b){b.onclick=function(){var i=$(b.dataset.t);i.type=i.type==='password'?'text':'password';};});
function check(){
  var v=$('nw').value,c=$('cf').value;
  var t=[v.length>=8,/[A-Z]/.test(v),/[a-z]/.test(v),/[0-9]/.test(v),v&&v===c];
  for(var i=0;i<5;i++){var d=$('r'+(i+1));d.className=t[i]?'ok':'';d.textContent=(t[i]?'✔ ':'• ')+d.textContent.replace(/^[✔•] /,'');}
  return t.every(Boolean);
}
$('nw').oninput=check;$('cf').oninput=check;
$('go').onclick=async function(){
  var m=$('msg');m.className='msg';
  if(!check()){m.className='msg err';m.textContent='⚠️ أكمل شروط كلمة المرور والتأكيد';return;}
  var b=$('go');b.disabled=true;b.textContent='جارٍ التغيير…';
  try{
    var lr=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value.trim(),password:$('cur').value})});
    var lj=await lr.json();
    if(!lr.ok)throw new Error(lj.error||'كلمة المرور الحالية غير صحيحة');
    var cr=await fetch(API+'/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+lj.token},body:JSON.stringify({new_password:$('nw').value})});
    var cj=await cr.json();
    if(!cr.ok)throw new Error(cj.error||'فشل التغيير');
    m.className='msg ok';m.innerHTML='✅ تم تغيير كلمة المرور بنجاح!<br>الآن: سجّل الخروج من اللوحة وادخل بالكلمة الجديدة، ثم <b>احذف ملف password.html</b> من المستودع.';
    b.textContent='تم ✔';
  }catch(e){m.className='msg err';m.textContent='⚠️ '+e.message;b.disabled=false;b.textContent='تغيير كلمة المرور';}
};
</script>
</body>
</html>
