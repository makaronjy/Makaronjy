<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — الصفحة غير موجودة | مكرونجي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--dark:#5a1830;--brown:#8e2a4a;--gold:#e0912f;--gold2:#f2b95f;--cream:#faf3ea;--muted:#8a6f63}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--dark);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
  background-image:radial-gradient(#efe3d3 1px,transparent 1px);background-size:22px 22px}
.card{background:#fffdf9;border:2px solid var(--gold);border-radius:22px;padding:2rem 1.5rem;
  max-width:380px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(90,24,48,.15)}
.ico{font-size:3.2rem;line-height:1}
.code{font-size:2.6rem;font-weight:900;color:var(--brown);margin:.4rem 0 .2rem;letter-spacing:2px}
h1{font-size:1.05rem;font-weight:900;margin-bottom:.5rem}
p{color:var(--muted);font-size:.85rem;font-weight:700;line-height:1.9;margin-bottom:1.3rem}
a{display:block;border-radius:14px;padding:.9rem;text-decoration:none;font-weight:900;font-size:.95rem;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark)}
a:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="card">
  <div class="ico">🍝</div>
  <div class="code">404</div>
  <h1>الصفحة غير موجودة</h1>
  <p>الرابط الذي فتحته غير صحيح أو لم يعد متاحاً.</p>
  <a href="/">🏠 العودة للتطبيق</a>
</div>
</body>
</html>
