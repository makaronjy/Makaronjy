<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-t="supervisor.pageTitle">لوحة مشرف الفرع | مكرونجي</title>
<link rel="icon" href="img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --brown:#8e2a4a; --brown2:#a4385c; --dark:#5a1830;
  --gold:#e0912f; --gold2:#f2b95f; --cream:#faf3ea; --card:#fffdf9;
  --ink:#2b1a15; --muted:#8a6f63; --line:#eadfd2;
  --wa:#128c5e; --ok:#1e5b4f; --err:#b91c1c;
}
*,::before,::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Cairo',sans-serif;background:var(--cream);
  background-image:radial-gradient(#efe3d3 1px,transparent 1px);background-size:22px 22px;
  color:var(--ink);min-height:100vh;padding-bottom:3rem;
}

/* ─── الشريط العلوي ─── */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(90,24,48,.97);backdrop-filter:blur(8px);
  color:#fff;display:flex;align-items:center;gap:.5rem;
  flex-wrap:wrap;row-gap:.4rem;
  padding:.65rem 1rem;box-shadow:0 4px 18px rgba(0,0,0,.25);
}
.topbar .brand{display:flex;align-items:center;min-width:0;}
.topbar .brand b{font-size:.95rem;font-weight:900;display:block;line-height:1.2;}
.topbar .brand small{color:var(--gold2);font-size:.7rem;font-weight:700;display:block;}
.topbar .spacer{flex:1;}
.bell{
  position:relative;background:#ffffff14;border:1px solid #ffffff2b;
  border-radius:50px;padding:.35rem .8rem;color:#fff;
  font-family:inherit;font-weight:900;font-size:.8rem;cursor:pointer;
}
.bell .cnt{
  position:absolute;top:-6px;inset-inline-end:-6px;
  background:var(--err);color:#fff;border-radius:50px;
  min-width:20px;height:20px;font-size:.68rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}
.icon-btn{
  background:#ffffff14;border:1px solid #ffffff2b;border-radius:50px;
  padding:.35rem .7rem;color:#fff;font-family:inherit;
  font-weight:900;font-size:.8rem;cursor:pointer;
}
.icon-btn.off{opacity:.5;}
.lang-toggle{
  display:inline-flex;background:#ffffff14;border:1px solid #ffffff2b;
  border-radius:50px;padding:3px;gap:2px;
}
.lang-toggle button{
  padding:.3rem .72rem;border-radius:50px;border:none;
  background:transparent;color:#ffffffb0;
  font-family:inherit;font-weight:900;font-size:.72rem;cursor:pointer;
}
.lang-toggle button.active{
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark);
}

/* ─── الإحصائيات ─── */
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;
  max-width:1100px;margin:1rem auto;padding:0 1rem;
}
.stat{
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:.8rem;text-align:center;
}
.stat b{display:block;font-size:1.35rem;font-weight:900;color:var(--brown);}
.stat small{color:var(--muted);font-size:.72rem;font-weight:800;}

/* ─── الأقسام ─── */
.wrap{max-width:1100px;margin:0 auto;padding:0 1rem;}
.sec-title{
  display:flex;align-items:center;gap:.5rem;
  font-size:1.05rem;font-weight:900;color:var(--brown);
  margin:1.4rem 0 .7rem;
}
.sec-title .pill{
  background:var(--brown);color:#fff;border-radius:50px;
  padding:.1rem .6rem;font-size:.72rem;font-weight:900;
}

/* ─── بطاقة الطلب ─── */
.order-card{
  background:var(--card);border:1.5px solid var(--line);border-radius:18px;
  padding:1rem;margin-bottom:.8rem;
  box-shadow:0 2px 8px rgba(90,24,48,.06);
}
.order-card.new{border-color:var(--gold);box-shadow:0 0 0 3px #e0912f22,0 8px 22px rgba(90,24,48,.12);}
.order-card.pool{border-color:#38bdf8;box-shadow:0 0 0 2px #38bdf822;}
.oc-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem;}
.oc-num{
  background:var(--dark);color:var(--gold2);border-radius:10px;
  padding:.2rem .7rem;font-weight:900;font-size:.95rem;direction:ltr;
}
.oc-type{border-radius:50px;padding:.15rem .65rem;font-size:.7rem;font-weight:900;}
.oc-type.pickup{background:#fff6e6;color:#a06b1c;border:1px dashed var(--gold);}
.oc-type.delivery{background:#e3f2fd;color:#1565c0;border:1px dashed #90caf9;}
.oc-cust{font-weight:900;font-size:.95rem;}
.oc-phone{color:var(--muted);font-weight:800;font-size:.8rem;direction:ltr;}
.oc-total{margin-inline-start:auto;font-weight:900;color:var(--ok);font-size:1rem;}

/* v2.4: الوقت النسبي */
.oc-time{
  display:inline-flex;align-items:center;gap:.25rem;
  font-size:.72rem;font-weight:900;color:var(--muted);
  background:#f3e7d7;border-radius:50px;padding:.15rem .6rem;
  direction:ltr;
}
.oc-time.urgent{background:#fee2e2;color:var(--err);}
.oc-time.warn{background:#fff6e6;color:#a06b1c;}
.oc-time.fresh{background:#dcf5e8;color:var(--ok);}

.oc-line{font-size:.85rem;font-weight:700;color:var(--ink);margin:.25rem 0;line-height:1.7;}
.oc-line .lbl{color:var(--muted);}
.oc-items{
  background:#fff;border:1px dashed var(--line);border-radius:12px;
  padding:.5rem .7rem;margin:.5rem 0;font-size:.83rem;font-weight:800;line-height:1.9;
}
.oc-note{
  background:#fff6e6;border:1px dashed var(--gold);border-radius:10px;
  padding:.4rem .7rem;font-size:.8rem;font-weight:800;color:#a06b1c;margin:.4rem 0;
}
.oc-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem;}
.btn{
  border:none;border-radius:12px;padding:.6rem 1rem;
  font-family:inherit;font-weight:900;font-size:.83rem;cursor:pointer;transition:.2s;
}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-ok{background:var(--ok);color:#fff;}
.btn-err{background:#fee2e2;color:var(--err);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark);}
.btn-wa{background:var(--wa);color:#fff;}
.btn-blue{background:#38bdf8;color:#0c4a6e;}
.btn-plain{background:#f3e7d7;color:var(--brown2);}
.sel{
  border:1.5px solid var(--line);border-radius:10px;padding:.55rem .6rem;
  font-family:inherit;font-weight:800;background:#fff;color:var(--ink);
}
.map-link{
  color:var(--brown2);font-weight:900;font-size:.8rem;text-decoration:none;
  border-bottom:1.5px dashed var(--gold);
}

/* بطاقة الحوض */
.pool-info{
  background:#e0f2fe;border:1.5px dashed #38bdf8;border-radius:12px;
  padding:.7rem .9rem;margin:.4rem 0;font-size:.82rem;font-weight:800;
  color:#075985;line-height:1.8;display:flex;align-items:center;gap:.6rem;
}
.pool-info .ico{font-size:1.6rem;}
.pool-info .txt{flex:1;}
.pool-info b{display:block;font-size:.9rem;font-weight:900;}
.pool-toggle{
  background:transparent;border:none;color:#075985;
  font-family:inherit;font-weight:900;font-size:.75rem;
  cursor:pointer;text-decoration:underline;padding:0;
}
.pool-assign-wrap{
  display:none;background:#f0f9ff;border:1px solid #bae6fd;
  border-radius:10px;padding:.6rem;margin-top:.5rem;
}
.pool-assign-wrap.show{display:block;}
.pool-assign-wrap small{
  display:block;color:var(--muted);font-size:.72rem;
  font-weight:800;margin-bottom:.4rem;
}
.pool-assign-wrap .row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;}
.pool-assign-wrap .sel{flex:1;min-width:140px;}

/* النافذة branded */
.mk-modal-overlay{
  position:fixed;inset:0;z-index:9999;
  background:rgba(90,24,48,.6);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  padding:1rem;animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.mk-modal{
  background:var(--card);border:2px solid var(--gold);
  border-radius:20px;padding:1.5rem;max-width:420px;width:100%;
  box-shadow:0 20px 50px rgba(90,24,48,.4);animation:popIn .25s;
}
@keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.mk-modal-ico{
  font-size:3rem;text-align:center;margin-bottom:.5rem;
}
.mk-modal-title{
  font-size:1.2rem;font-weight:900;color:var(--brown);
  text-align:center;margin-bottom:.5rem;
}
.mk-modal-msg{
  font-size:.9rem;font-weight:800;color:var(--ink);
  text-align:center;line-height:1.8;margin-bottom:.8rem;
}
.mk-modal-meta{
  background:#faf3ea;border:1px dashed var(--gold);border-radius:10px;
  padding:.5rem .8rem;font-size:.78rem;font-weight:900;color:var(--brown);
  text-align:center;margin-bottom:1rem;direction:ltr;
}
.mk-modal-actions{
  display:flex;gap:.5rem;justify-content:center;
}
.mk-modal-actions .btn{flex:1;padding:.7rem 1rem;font-size:.9rem;}
.mk-modal-actions .btn-danger{background:#fee2e2;color:var(--err);border:1.5px solid var(--err);}
.mk-modal-actions .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark);}
.mk-modal-actions .btn-cancel{background:#f3e7d7;color:var(--brown2);}

/* ─── التوست ─── */
.mk-toast{
  position:fixed;bottom:2rem;inset-inline-start:50%;transform:translateX(-50%);
  background:var(--dark);color:#fff;border-radius:50px;padding:.7rem 1.3rem;
  font-weight:900;font-size:.88rem;z-index:10000;box-shadow:0 8px 24px rgba(0,0,0,.3);
  animation:slideUp .3s;
}
@keyframes slideUp{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.mk-toast.err{background:var(--err);}
.mk-toast.ok{background:var(--ok);}

/* ─── تقرير الطباعة ─── */
@media print{
  .topbar,.oc-actions,.stats,.sec-title,.btn,.pool-toggle,.pool-assign-wrap{display:none!important}
  body{background:#fff;}
  .order-card{break-inside:avoid;border:1px solid #999;box-shadow:none;}
  .report-area{display:block!important;}
}
.report-area{display:none;}
.report-area h2{color:var(--brown);margin-bottom:.5rem;}
.report-area table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:12px;}
.report-area th,.report-area td{border:1px solid #999;padding:6px;text-align:start;}
.report-area th{background:#f3e7d7;}
</style>
</head>
<body>

<!-- ─── الشريط العلوي ─── -->
<div class="topbar">
  <div class="brand">
    <b data-t="supervisor.pageTitle">لوحة مشرف الفرع</b>
    <small id="brName">—</small>
  </div>
  <div class="spacer"></div>
  <button class="bell" onclick="location.reload()">
    🔔 <span data-t="supervisor.actions.refresh">تحديث</span>
    <span class="cnt" id="newCnt" style="display:none">0</span>
  </button>
  <button class="icon-btn" onclick="printReport()">🖨️</button>
  <button class="icon-btn" onclick="logout()" data-t="common.logout">خروج</button>
  <div class="lang-toggle" id="langToggle">
    <button data-lang="ar" class="active">AR</button>
    <button data-lang="en">EN</button>
  </div>
</div>

<!-- ─── الإحصائيات ─── -->
<div class="stats">
  <div class="stat"><b id="stToday">0</b><small data-t="supervisor.stats.todayOrders">طلبات اليوم</small></div>
  <div class="stat"><b id="stRev">0</b><small data-t="supervisor.stats.todayRevenue">مبيعات اليوم (ريال)</small></div>
  <div class="stat"><b id="stDrv">0</b><small data-t="supervisor.stats.availableDrivers">سائقون متاحون</small></div>
</div>

<!-- ─── المحتوى ─── -->
<div class="wrap">
  <h3 class="sec-title">🆕 <span data-t="supervisor.sections.newOrders">طلبات جديدة</span> <span class="pill" id="cntNew">0</span></h3>
  <div id="listNew"></div>

  <h3 class="sec-title">🔥 <span data-t="supervisor.sections.inProgress">قيد التنفيذ</span> <span class="pill" id="cntProg">0</span></h3>
  <div id="listProgress"></div>

  <h3 class="sec-title">🚗 <span data-t="supervisor.sections.activeDelivery">توصيلات نشطة</span> <span class="pill" id="cntActive">0</span></h3>
  <div id="listActive"></div>

  <h3 class="sec-title">✅ <span data-t="supervisor.sections.deliveredToday">سُلّم اليوم</span> <span class="pill" id="cntDone">0</span></h3>
  <div id="listDone"></div>
</div>

<!-- منطقة التقرير (للطباعة) -->
<div class="report-area" id="reportArea"></div>

<script src="i18n-staff.js"></script>
<script src="menu.js"></script>
<script>
/* ═══════════════════════════════════════════
   مكرونجي — لوحة مشرف الفرع (v2.4)
   v2.4: الوقت النسبي المتجدد كل 5 ثوانٍ + تصحيح المنطقة الزمنية
   v2.3: نوافذ branded + صورة الإثبات + ترجمة المنيو
   ═══════════════════════════════════════════ */

const API = 'https://makaronjy-api.makaronjy.workers.dev';
const REFRESH_MS = 5000; // 5 ثوانٍ للتحديث الدوري
const TIME_REFRESH_MS = 5000; // 5 ثوانٍ لتحديث الوقت النسبي

let JWT = localStorage.getItem('mk_staff_token') || '';
let USER = null;
let LAST_ORDERS = [];
let DRIVERS = [];
let MENU_DATA = null;
let TIME_TICK = 0;

/* ─── التهيئة ─── */
try { USER = JSON.parse(localStorage.getItem('mk_staff_user') || 'null'); } catch (e) { USER = null; }
if (!JWT || !USER) location.href = 'login.html';
if (USER.role !== 'supervisor' && USER.role !== 'super_admin') {
  location.href = USER.role === 'driver' ? 'driver.html' : 'index.html';
}

/* ─── API ─── */
async function api(path, opts = {}) {
  opts.headers = opts.headers || {};
  opts.headers['Content-Type'] = 'application/json';
  opts.headers['Authorization'] = 'Bearer ' + JWT;
  const r = await fetch(API + path, opts);
  if (r.status === 401) { logout(); throw new Error('unauthorized'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}

/* ─── اللغة ─── */
function isEn() { return getStaffLang() === 'en'; }
function cur() { return tt('common.riyal'); }
function syncLangUI() {
  document.documentElement.lang = getStaffLang();
  document.documentElement.dir = isEn() ? 'ltr' : 'rtl';
  applyStaffI18n();
  document.querySelectorAll('#langToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === getStaffLang());
  });
}
document.getElementById('langToggle').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  setStaffLang(b.dataset.lang);
  syncLangUI();
  render(false);
});

/* ─── ترجمة المنيو ─── */
async function loadMenu() {
  if (MENU_DATA) return MENU_DATA;
  try {
    const r = await fetch('menu.js', { cache: 'no-store' });
    const text = await r.text();
    const m = text.match(/window\.MENU\s*=\s*(\[[\s\S]*?\]);/);
    if (m) MENU_DATA = JSON.parse(m[1]);
    else MENU_DATA = [];
  } catch (e) { MENU_DATA = []; }
  return MENU_DATA;
}
function findMenuItem(id) {
  if (!MENU_DATA || !id) return null;
  for (const sec of MENU_DATA) {
    for (const it of sec.items || []) if (it.id === id) return it;
  }
  return null;
}
function itemName(item) {
  if (isEn() && item.name_en) return item.name_en;
  if (!isEn() && item.name_ar) return item.name_ar;
  const live = findMenuItem(item.id);
  if (live) return isEn() ? (live.en || live.ar) : (live.ar || live.en);
  return item.name || '';
}

/* ─── v2.4: الوقت النسبي (توقيت الرياض) ─── */
function parseServerDate(str) {
  // D1 يرجع نصاً بصيغة "2026-11-05 14:30:00" بـ UTC
  if (!str) return null;
  let s = String(str);
  if (!s.includes('T') && !s.includes('Z')) s = s.replace(' ', 'T') + 'Z';
  return new Date(s);
}
function timeAgo(date) {
  if (!date) return '—';
  const now = new Date();
  const sec = Math.floor((now - date) / 1000);
  const en = isEn();
  if (sec < 5) return en ? 'just now' : 'الآن';
  if (sec < 60) return en ? `${sec}s ago` : `قبل ${sec} ثانية`;
  const min = Math.floor(sec / 60);
  if (min < 60) {
    if (en) return min === 1 ? '1 min ago' : `${min} min ago`;
    if (min === 1) return 'قبل دقيقة';
    if (min === 2) return 'قبل دقيقتين';
    if (min <= 10) return `قبل ${min} دقائق`;
    return `قبل ${min} دقيقة`;
  }
  const hr = Math.floor(min / 60);
  if (hr < 24) {
    if (en) return hr === 1 ? '1 hour ago' : `${hr} hours ago`;
    if (hr === 1) return 'قبل ساعة';
    if (hr === 2) return 'قبل ساعتين';
    if (hr <= 10) return `قبل ${hr} ساعات`;
    return `قبل ${hr} ساعة`;
  }
  const day = Math.floor(hr / 24);
  if (day === 1) return en ? 'yesterday' : 'أمس';
  if (day < 7) return en ? `${day} days ago` : `قبل ${day} أيام`;
  return date.toLocaleDateString(en ? 'en-GB' : 'ar-SA', {
    day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
  });
}
function timeClass(date) {
  if (!date) return '';
  const sec = (Date.now() - date.getTime()) / 1000;
  if (sec < 300) return 'fresh';        // < 5 دقائق: أخضر
  if (sec < 1800) return '';              // 5-30 دقيقة: رمادي عادي
  return 'warn';                          // > 30 دقيقة: برتقالي
}
function refreshTimeAgo() {
  document.querySelectorAll('[data-time]').forEach(el => {
    const dt = parseServerDate(el.dataset.time);
    if (dt) {
      el.textContent = timeAgo(dt);
      el.className = 'oc-time ' + timeClass(dt);
    }
  });
}

/* ─── نافذة التأكيد branded ─── */
function confirmModal(msg, opts = {}) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'mk-modal-overlay';
    const yesClass = opts.danger ? 'btn btn-danger' : 'btn btn-gold';
    overlay.innerHTML = `
      <div class="mk-modal">
        <div class="mk-modal-ico">${opts.icon || '⚠️'}</div>
        <div class="mk-modal-title">${opts.title || ''}</div>
        <div class="mk-modal-msg">${msg}</div>
        ${opts.meta ? `<div class="mk-modal-meta">${opts.meta}</div>` : ''}
        <div class="mk-modal-actions">
          <button class="btn btn-cancel" data-act="no">${opts.no || tt('common.cancel') || 'إلغاء'}</button>
          <button class="${yesClass}" data-act="yes">${opts.yes || tt('common.confirm') || 'تأكيد'}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => {
      const act = e.target.dataset.act;
      if (!act && e.target !== overlay) return;
      overlay.remove();
      resolve(act === 'yes');
    });
  });
}

/* ─── التوست ─── */
function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = 'mk-toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2800);
}

/* ─── الأدوات ─── */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function isPickup(o) { return o.order_type === 'pickup'; }
function typeBadge(o) {
  if (isPickup(o)) return `<span class="oc-type pickup">🏪 ${tt('supervisor.badges.pickup')}</span>`;
  return `<span class="oc-type delivery">🛵 ${tt('supervisor.badges.delivery')}</span>`;
}
function statusLbl(o) {
  if (isPickup(o)) {
    if (o.status === 'ready') return tt('supervisor.actions.readyForPickup');
    if (o.status === 'delivered') return '✅ ' + (isEn() ? 'Picked up' : 'تم الاستلام');
  }
  return o.status_text || o.status;
}
function itemsLine(items) {
  if (!items || !items.length) return '—';
  return items.map(i => `${i.qty}× ${esc(itemName(i))}${i.size ? ' (' + esc(i.size) + ')' : ''}`).join(' • ');
}
function branchName() { return USER.branchName || (isEn() ? 'Branch' : 'الفرع'); }

/* ─── تحميل البيانات ─── */
async function loadAll(first) {
  try {
    const [ordersRes, driversRes] = await Promise.all([
      api('/api/supervisor/orders'),
      api('/api/supervisor/drivers'),
    ]);
    DRIVERS = driversRes.drivers || [];
    LAST_ORDERS = ordersRes.orders || [];
    if (first && ordersRes.branch_name) {
      document.getElementById('brName').textContent = ordersRes.branch_name;
    }
    render(first);
  } catch (e) {
    if (e.message !== 'unauthorized') toast('⚠️ ' + tt('supervisor.toast.updateFailed'), 'err');
  }
}

/* ─── بطاقة طلب جديد ─── */
function cardNew(o) {
  return `
  <div class="order-card new">
    <div class="oc-head">
      <span class="oc-num">${o.number}</span>
      ${typeBadge(o)}
      <span class="oc-cust">👤 ${esc(o.customer_name)}</span>
      <a class="oc-phone" href="tel:${esc(o.customer_phone)}">${esc(o.customer_phone)}</a>
      <span class="oc-total">${o.total} ${cur()}</span>
    </div>
    <div class="oc-line"><span class="oc-time fresh" data-time="${o.created_at}">${timeAgo(parseServerDate(o.created_at))}</span></div>
    <div class="oc-line"><span class="lbl">${tt('supervisor.labels.address')}:</span> ${esc(o.customer_address || '—')}</div>
    <div class="oc-items"><span class="lbl">${tt('supervisor.labels.items')}:</span> ${itemsLine(o.items)}</div>
    ${o.notes ? `<div class="oc-note">📝 ${esc(o.notes)}</div>` : ''}
    <div class="oc-actions">
      <button class="btn btn-ok" onclick="act(${o.id},'accepted')">✅ ${tt('supervisor.actions.confirm')}</button>
      <button class="btn btn-err" onclick="act(${o.id},'cancelled')">❌ ${tt('supervisor.actions.reject')}</button>
      <button class="btn btn-wa" onclick='waConfirm(${JSON.stringify(o).replace(/"/g,"&quot;")})'>📱 ${tt('supervisor.actions.waVerify')}</button>
    </div>
  </div>`;
}

/* ─── بطاقة قيد التنفيذ ─── */
function cardProgress(o) {
  let actions = '';
  let poolInfo = '';
  if (o.status === 'accepted') {
    actions = `<button class="btn btn-gold" onclick="act(${o.id},'preparing')">👨‍🍳 ${tt('supervisor.actions.preparing')}</button>
      <button class="btn btn-wa" onclick='waConfirm(${JSON.stringify(o).replace(/"/g,"&quot;")})'>📱 ${tt('supervisor.actions.waVerify')}</button>`;
  } else if (o.status === 'preparing') {
    actions = `<button class="btn btn-gold" onclick="act(${o.id},'ready')">📦 ${isPickup(o) ? tt('supervisor.actions.readyForPickup') : tt('supervisor.actions.ready')}</button>`;
  } else if (o.status === 'ready') {
    if (isPickup(o)) {
      actions = `
        <button class="btn btn-ok" onclick="act(${o.id},'delivered')">✅ ${tt('supervisor.actions.pickupFromBranch')}</button>
        <span style="align-self:center;font-weight:900;font-size:.78rem;color:var(--ok)">${tt('supervisor.actions.pickupHint')} ${o.total} ${tt('supervisor.actions.atCashier')}</span>`;
    } else {
      poolInfo = `
        <div class="pool-info">
          <div class="ico">📦</div>
          <div class="txt">
            <b>${isEn() ? 'Ready for drivers pool' : 'جاهز لحوض السائقين'}</b>
            <small>${isEn() ? 'Drivers will see and claim this order' : 'السائقون سيرون الطلب ويستلمونه'}</small>
          </div>
          <button class="pool-toggle" onclick="togglePoolAssign(${o.id})">${tt('supervisor.actions.assignDriver')} ↴</button>
        </div>
        <div class="pool-assign-wrap" id="poolWrap-${o.id}">
          <small>${isEn() ? 'Manual fallback — assign a specific driver' : 'احتياط يدوي — اختر سائقاً محدداً'}</small>
          <div class="row">
            <select class="sel" id="drv-${o.id}">
              <option value="">${tt('supervisor.actions.chooseDriver')}</option>
              ${DRIVERS.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('')}
            </select>
            <button class="btn btn-blue" onclick="assign(${o.id})">${tt('supervisor.actions.assignDriver')}</button>
          </div>
        </div>`;
    }
  }
  return `
  <div class="order-card${o.status === 'ready' && !isPickup(o) ? ' pool' : ''}">
    <div class="oc-head">
      <span class="oc-num">${o.number}</span>
      ${typeBadge(o)}
      <span class="oc-cust">👤 ${esc(o.customer_name)}</span>
      <span class="oc-total">${o.total} ${cur()}</span>
    </div>
    <div class="oc-line">
      <span class="lbl">${tt('supervisor.labels.status')}:</span> ${statusLbl(o)}
      <span class="oc-time" data-time="${o.created_at}">${timeAgo(parseServerDate(o.created_at))}</span>
    </div>
    ${poolInfo}
    <div class="oc-items"><span class="lbl">${tt('supervisor.labels.items')}:</span> ${itemsLine(o.items)}</div>
    ${actions ? `<div class="oc-actions">${actions}</div>` : ''}
  </div>`;
}

/* ─── بطاقة توصيل نشط ─── */
function cardActive(o) {
  const mapLink = (o.driver_lat && o.driver_lng)
    ? `<a class="map-link" target="_blank" href="https://www.google.com/maps?q=${o.driver_lat},${o.driver_lng}">${tt('supervisor.actions.driverLocation')}</a>`
    : '';
  return `
  <div class="order-card">
    <div class="oc-head">
      <span class="oc-num">${o.number}</span>
      ${typeBadge(o)}
      <span class="oc-cust">🚗 ${esc(o.driver_name || tt('supervisor.actions.unknownDriver'))}</span>
      ${o.driver_phone ? `<a class="oc-phone" href="tel:${esc(o.driver_phone)}">${esc(o.driver_phone)}</a>` : ''}
    </div>
    <div class="oc-line">
      <span class="lbl">👤 ${tt('supervisor.labels.customer')}:</span> ${esc(o.customer_name)} — 
      <a class="oc-phone" href="tel:${esc(o.customer_phone)}">${esc(o.customer_phone)}</a>
    </div>
    <div class="oc-line">
      <span class="lbl">${tt('supervisor.labels.status')}:</span> ${statusLbl(o)} ${mapLink}
      <span class="oc-time" data-time="${o.created_at}">${timeAgo(parseServerDate(o.created_at))}</span>
    </div>
    <div class="oc-line"><a class="map-link" target="_blank" href="track.html?order=${encodeURIComponent(o.number)}">${tt('supervisor.actions.openTracking')}</a></div>
  </div>`;
}

/* ─── بطاقة تسليم ─── */
function cardDone(o) {
  const photoBtn = isPickup(o) ? '' :
    `<button class="btn btn-plain" data-act="photo" data-id="${o.id}" title="${isEn() ? 'Delivery proof photo' : 'صورة إثبات التسليم'}">📸</button>`;
  return `
  <div class="order-card">
    <div class="oc-head">
      <span class="oc-num">${o.number}</span>
      ${typeBadge(o)}
      <span class="oc-cust">👤 ${esc(o.customer_name)}</span>
      <span class="oc-total">${o.total} ${cur()}</span>
    </div>
    <div class="oc-line">
      <span class="lbl">🚗 ${tt('supervisor.labels.driver')}:</span> 
      ${isPickup(o) ? tt('supervisor.badges.pickup') : (o.driver_name ? esc(o.driver_name) : '—')}
      <span class="oc-time" data-time="${o.delivered_at || o.updated_at || o.created_at}">${timeAgo(parseServerDate(o.delivered_at || o.updated_at || o.created_at))}</span>
    </div>
    <div class="oc-actions">${photoBtn}</div>
  </div>`;
}

/* ─── العرض ─── */
function render(first) {
  const orders = LAST_ORDERS;
  const news = orders.filter(o => o.status === 'pending');
  const progs = orders.filter(o => ['accepted', 'preparing', 'ready'].includes(o.status));
  const actives = orders.filter(o => ['driver_assigned', 'driver_at_restaurant', 'out_for_delivery'].includes(o.status));
  const dones = orders.filter(o => o.status === 'delivered');

  document.getElementById('listNew').innerHTML = news.length ? news.map(cardNew).join('') :
    `<div class="order-card"><div style="text-align:center;color:var(--muted);font-weight:800;padding:1rem">${tt('supervisor.empty.newOrders')}</div></div>`;
  document.getElementById('listProgress').innerHTML = progs.length ? progs.map(cardProgress).join('') :
    `<div class="order-card"><div style="text-align:center;color:var(--muted);font-weight:800;padding:1rem">${tt('supervisor.empty.inProgress')}</div></div>`;
  document.getElementById('listActive').innerHTML = actives.length ? actives.map(cardActive).join('') :
    `<div class="order-card"><div style="text-align:center;color:var(--muted);font-weight:800;padding:1rem">${tt('supervisor.empty.activeDelivery')}</div></div>`;
  document.getElementById('listDone').innerHTML = dones.length ? dones.slice(0, 20).map(cardDone).join('') :
    `<div class="order-card"><div style="text-align:center;color:var(--muted);font-weight:800;padding:1rem">${tt('supervisor.empty.deliveredToday')}</div></div>`;

  document.getElementById('cntNew').textContent = news.length;
  document.getElementById('cntProg').textContent = progs.length;
  document.getElementById('cntActive').textContent = actives.length;
  document.getElementById('cntDone').textContent = dones.length;
  document.getElementById('stToday').textContent = orders.length;
  document.getElementById('stRev').textContent = dones.reduce((s, o) => s + o.total, 0);
  document.getElementById('stDrv').textContent = DRIVERS.length;

  const bell = document.getElementById('newCnt');
  if (news.length) { bell.style.display = 'flex'; bell.textContent = news.length; }
  else bell.style.display = 'none';

  if (first) refreshTimeAgo();
}

/* ─── عرض الصورة ─── */
function viewPhoto(id) {
  const o = LAST_ORDERS.find(x => x.id === id);
  if (!o) return;
  const url = `${API}/api/orders/${id}/photo`;
  fetch(url, { headers: { 'Authorization': 'Bearer ' + JWT } })
    .then(r => {
      if (!r.ok) throw new Error('no photo');
      return r.blob();
    })
    .then(blob => {
      const win = window.open('');
      const u = URL.createObjectURL(blob);
      win.document.write(`<html><head><title>${o.number}</title></head><body style="margin:0;background:#000;display:grid;place-items:center;min-height:100vh">
        <img src="${u}" style="max-width:100%;max-height:100vh">
        </body></html>`);
    })
    .catch(() => toast(isEn() ? '⚠️ No photo available' : '⚠️ لا توجد صورة', 'err'));
}

function togglePoolAssign(id) {
  const w = document.getElementById('poolWrap-' + id);
  if (w) w.classList.toggle('show');
}

/* ─── تغيير حالة ─── */
async function act(id, status) {
  const o = LAST_ORDERS.find(x => x.id === id);
  if (status === 'cancelled') {
    const ok = await confirmModal(tt('supervisor.actions.confirmReject'), {
      icon: '❌',
      title: tt('supervisor.actions.reject'),
      yes: tt('supervisor.actions.reject'),
      danger: true,
      meta: o ? (o.number + ' • ' + o.customer_name + ' • ' + o.total + ' ' + cur()) : ''
    });
    if (!ok) return;
  }
  if (status === 'delivered') {
    const ok = await confirmModal(tt('supervisor.actions.confirmPickup'), {
      icon: '✅',
      title: tt('supervisor.actions.pickupFromBranch'),
      yes: isEn() ? 'Yes, picked up' : 'نعم، استلمه العميل',
      meta: o ? (o.number + ' • ' + o.customer_name + ' • ' + o.total + ' ' + cur()) : ''
    });
    if (!ok) return;
  }
  try {
    await api(`/api/orders/${id}/status`, {
      method: 'PUT',
      body: JSON.stringify({ status }),
    });
    toast('✓ ' + tt('supervisor.toast.statusUpdated'), 'ok');
    loadAll(false);
  } catch (e) {
    toast('⚠️ ' + e.message, 'err');
  }
}

/* ─── تعيين يدوي ─── */
async function assign(id) {
  const sel = document.getElementById('drv-' + id);
  const driverId = sel ? sel.value : '';
  if (!driverId) { toast('⚠️ ' + tt('supervisor.toast.chooseDriverFirst'), 'err'); return; }
  try {
    const r = await api(`/api/orders/${id}/assign`, {
      method: 'PUT',
      body: JSON.stringify({ driver_id: parseInt(driverId) }),
    });
    toast('✓ ' + tt('supervisor.toast.driverAssigned') + ': ' + r.driver_name, 'ok');
    loadAll(false);
  } catch (e) {
    toast('⚠️ ' + e.message, 'err');
  }
}

/* ─── واتساب التأكيد ─── */
function waConfirm(o) {
  const msg = tt('messages.supConfirm', {
    customer_name: o.customer_name,
    supervisor_name: USER.name,
    branch_name: branchName(),
    order_number: o.number,
    total: o.total,
  });
  const phone = o.customer_phone.replace(/[^0-9]/g, '');
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
}

/* ─── تفويض النقر ─── */
document.getElementById('listDone').addEventListener('click', function(e) {
  const b = e.target.closest('[data-act="photo"]');
  if (!b) return;
  viewPhoto(+b.dataset.id);
});

/* ─── تقرير الطباعة ─── */
function printReport() {
  const done = LAST_ORDERS.filter(o => o.status === 'delivered');
  const revenue = done.reduce((s, o) => s + o.total, 0);
  const fees = done.reduce((s, o) => s + o.delivery_fee, 0);
  document.getElementById('reportArea').innerHTML = `
    <h2>🍝 ${tt('supervisor.report.title')} ${branchName()}</h2>
    <p>${tt('supervisor.report.date')}: ${new Date().toLocaleString(isEn() ? 'en-GB' : 'ar-SA')}</p>
    <p>${tt('supervisor.report.totalOrders')}: ${LAST_ORDERS.length} | ${tt('supervisor.report.delivered')}: ${done.length} | ${tt('supervisor.report.revenue')}: ${revenue} ${cur()} | ${tt('supervisor.report.fees')}: ${fees} ${cur()}</p>
    <table>
      <tr>
        <th>${tt('supervisor.report.columns.orderNum')}</th>
        <th>${tt('supervisor.report.columns.type')}</th>
        <th>${tt('supervisor.report.columns.customer')}</th>
        <th>${tt('supervisor.report.columns.phone')}</th>
        <th>${tt('supervisor.report.columns.total')}</th>
        <th>${tt('supervisor.report.columns.status')}</th>
        <th>${tt('supervisor.report.columns.driver')}</th>
      </tr>
      ${LAST_ORDERS.map(o => `
        <tr>
          <td>${o.number}</td>
          <td>${isPickup(o) ? (isEn() ? 'Pickup' : 'استلام') : (isEn() ? 'Delivery' : 'توصيل')}</td>
          <td>${esc(o.customer_name)}</td>
          <td>${esc(o.customer_phone)}</td>
          <td>${o.total}</td>
          <td>${statusLbl(o)}</td>
          <td>${isPickup(o) ? '🏪' : (o.driver_name ? esc(o.driver_name) : '—')}</td>
        </tr>`).join('')}
    </table>
    <p style="margin-top:1rem">${tt('supervisor.report.savePdfHint')}</p>
  `;
  window.print();
}

/* ─── خروج ─── */
async function logout() {
  const ok = await confirmModal(tt('supervisor.confirmLogout'), {
    icon: '🚪',
    title: tt('common.logout'),
    yes: tt('common.confirm')
  });
  if (!ok) return;
  localStorage.removeItem('mk_staff_token');
  localStorage.removeItem('mk_staff_user');
  location.href = 'login.html';
}

/* ─── الإقلاع ─── */
initStaffI18n({ autoLangToggle: false });
syncLangUI();
window.addEventListener('staff-lang-changed', function() {
  syncLangUI();
  render(false);
});
loadMenu().then(function() {
  loadAll(true);
});
setInterval(() => loadAll(false), REFRESH_MS);
setInterval(refreshTimeAgo, TIME_REFRESH_MS); // تحديث الوقت كل 5 ثوانٍ
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadAll(false);
});
</script>

</body>
