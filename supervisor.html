<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-t="supervisor.pageTitle">لوحة مشرف الفرع | مكرونجي</title>
<link rel="icon" href="img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --brown:#8e2a4a; --brown2:#a4385c; --dark:#5a1830;
  --gold:#e0912f; --gold2:#f2b95f; --cream:#faf3ea; --card:#fffdf9;
  --ink:#2b1a15; --muted:#8a6f63; --line:#eadfd2;
  --wa:#128c5e; --ok:#1e5b4f; --err:#b91c1c;
}
*,::before,::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Cairo',sans-serif;background:var(--cream);
  background-image:radial-gradient(#efe3d3 1px,transparent 1px);background-size:22px 22px;
  color:var(--ink);min-height:100vh;padding-bottom:3rem;
}

/* ─── الشريط العلوي (v2.2: مرتب، بدون شعار) ─── */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(90,24,48,.97);backdrop-filter:blur(8px);
  color:#fff;display:flex;align-items:center;gap:.5rem;
  flex-wrap:wrap;row-gap:.4rem;
  padding:.65rem 1rem;box-shadow:0 4px 18px rgba(0,0,0,.25);
}
.topbar .brand{display:flex;align-items:center;min-width:0;}
.topbar .brand b{font-size:.95rem;font-weight:900;display:block;line-height:1.2;}
.topbar .brand small{color:var(--gold2);font-size:.7rem;font-weight:700;display:block;}
.topbar .spacer{flex:1;}
.bell{
  position:relative;background:#ffffff14;border:1px solid #ffffff2b;
  border-radius:50px;padding:.35rem .8rem;color:#fff;
  font-family:inherit;font-weight:900;font-size:.8rem;cursor:pointer;
}
.bell .cnt{
  position:absolute;top:-6px;inset-inline-end:-6px;
  background:var(--err);color:#fff;border-radius:50px;
  min-width:20px;height:20px;font-size:.68rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}
.icon-btn{
  background:#ffffff14;border:1px solid #ffffff2b;border-radius:50px;
  padding:.35rem .7rem;color:#fff;font-family:inherit;
  font-weight:900;font-size:.8rem;cursor:pointer;
}
.icon-btn.off{opacity:.5;}
/* v2.2: زر اللغة المدمج في الهيدر */
.lang-toggle{
  display:inline-flex;background:#ffffff14;border:1px solid #ffffff2b;
  border-radius:50px;padding:3px;gap:2px;
}
.lang-toggle button{
  padding:.3rem .72rem;border-radius:50px;border:none;
  background:transparent;color:#ffffffb0;
  font-family:inherit;font-weight:900;font-size:.72rem;cursor:pointer;
}
.lang-toggle button.active{
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark);
}

/* ─── الإحصائيات ─── */
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;
  max-width:1100px;margin:1rem auto;padding:0 1rem;
}
.stat{
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:.8rem;text-align:center;
}
.stat b{display:block;font-size:1.35rem;font-weight:900;color:var(--brown);}
.stat small{color:var(--muted);font-size:.72rem;font-weight:800;}

/* ─── الأقسام ─── */
.wrap{max-width:1100px;margin:0 auto;padding:0 1rem;}
.sec-title{
  display:flex;align-items:center;gap:.5rem;
  font-size:1.05rem;font-weight:900;color:var(--brown);
  margin:1.4rem 0 .7rem;
}
.sec-title .pill{
  background:var(--brown);color:#fff;border-radius:50px;
  padding:.1rem .6rem;font-size:.72rem;font-weight:900;
}

/* ─── بطاقة الطلب ─── */
.order-card{
  background:var(--card);border:1.5px solid var(--line);border-radius:18px;
  padding:1rem;margin-bottom:.8rem;
  box-shadow:0 2px 8px rgba(90,24,48,.06);
}
.order-card.new{border-color:var(--gold);box-shadow:0 0 0 3px #e0912f22,0 8px 22px rgba(90,24,48,.12);}
.order-card.pool{border-color:#38bdf8;box-shadow:0 0 0 2px #38bdf822;}
.oc-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem;}
.oc-num{
  background:var(--dark);color:var(--gold2);border-radius:10px;
  padding:.2rem .7rem;font-weight:900;font-size:.95rem;direction:ltr;
}
.oc-type{border-radius:50px;padding:.15rem .65rem;font-size:.7rem;font-weight:900;}
.oc-type.pickup{background:#fff6e6;color:#a06b1c;border:1px dashed var(--gold);}
.oc-type.delivery{background:#e3f2fd;color:#1565c0;border:1px dashed #90caf9;}
.oc-cust{font-weight:900;font-size:.95rem;}
.oc-phone{color:var(--muted);font-weight:800;font-size:.8rem;direction:ltr;}
.oc-total{margin-inline-start:auto;font-weight:900;color:var(--ok);font-size:1rem;}
.oc-line{font-size:.85rem;font-weight:700;color:var(--ink);margin:.25rem 0;line-height:1.7;}
.oc-line .lbl{color:var(--muted);}
.oc-items{
  background:#fff;border:1px dashed var(--line);border-radius:12px;
  padding:.5rem .7rem;margin:.5rem 0;font-size:.83rem;font-weight:800;line-height:1.9;
}
.oc-note{
  background:#fff6e6;border:1px dashed var(--gold);border-radius:10px;
  padding:.4rem .7rem;font-size:.8rem;font-weight:800;color:#a06b1c;margin:.4rem 0;
}
.oc-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem;}
.btn{
  border:none;border-radius:12px;padding:.6rem 1rem;
  font-family:inherit;font-weight:900;font-size:.83rem;cursor:pointer;transition:.2s;
}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-ok{background:var(--ok);color:#fff;}
.btn-err{background:#fee2e2;color:var(--err);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark);}
.btn-wa{background:var(--wa);color:#fff;}
.btn-blue{background:#38bdf8;color:#0c4a6e;}
.btn-plain{background:#f3e7d7;color:var(--brown2);}
.sel{
  border:1.5px solid var(--line);border-radius:10px;padding:.55rem .6rem;
  font-family:inherit;font-weight:800;background:#fff;color:var(--ink);
}
.map-link{
  color:var(--brown2);font-weight:900;font-size:.8rem;text-decoration:none;
  border-bottom:1.5px dashed var(--gold);
}

/* بطاقة الحوض */
.pool-info{
  background:#e0f2fe;border:1.5px dashed #38bdf8;border-radius:12px;
  padding:.7rem .9rem;margin:.4rem 0;font-size:.82rem;font-weight:800;
  color:#075985;line-height:1.8;display:flex;align-items:center;gap:.6rem;
}
.pool-info .ico{font-size:1.6rem;}
.pool-info .txt{flex:1;}
.pool-info b{display:block;font-size:.9rem;font-weight:900;}
.pool-toggle{
  background:transparent;border:none;color:#075985;
  font-family:inherit;font-weight:900;font-size:.75rem;
  cursor:pointer;text-decoration:underline;padding:0;
}
.pool-assign-wrap{
  display:none;background:#f0f9ff;border:1px solid #bae6fd;
  border-radius:10px;padding:.6rem;margin-top:.5rem;
}
.pool-assign-wrap.show{display:block;}
.pool-assign-wrap small{
  display:block;color:var(--muted);font-size:.72rem;
  font-weight:700;margin-bottom:.4rem;
}

/* ─── فارغ ─── */
.empty{
  text-align:center;color:var(--muted);font-weight:800;
  padding:1.6rem;border:1.5px dashed var(--line);border-radius:16px;font-size:.9rem;
}

/* ─── توست ─── */
#toast{position:fixed;bottom:1.2rem;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:.5rem;z-index:4000;pointer-events:none;}
.toast{
  background:var(--dark);color:#fff;border-radius:50px;
  padding:.6rem 1.4rem;font-weight:900;font-size:.85rem;
  box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .3s ease;
}
.toast.err{background:var(--err);}
.toast.ok{background:var(--ok);}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

/* ─── الطباعة ─── */
#reportArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #reportArea, #reportArea *{visibility:visible;}
  #reportArea{display:block;position:absolute;inset:0;padding:2rem;}
  #reportArea h2{margin-bottom:1rem;}
  #reportArea table{width:100%;border-collapse:collapse;font-size:12px;}
  #reportArea th,#reportArea td{border:1px solid #999;padding:6px;text-align:right;}
}
</style>
</head>
<body>

<!-- ═══ الشريط العلوي (v2.2) ═══ -->
<div class="topbar">
  <div class="brand">
    <div>
      <b id="supName">...</b>
      <small id="supBranch">...</small>
    </div>
  </div>
  <div class="spacer"></div>
  <button class="bell" id="bellBtn">🔔 <span class="cnt" id="bellCnt" hidden>0</span></button>
  <button class="icon-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
  <button class="icon-btn" onclick="printReport()">📄</button>
  <div class="lang-toggle">
    <button id="langAr" class="active" onclick="pickLang('ar')">AR</button>
    <button id="langEn" onclick="pickLang('en')">EN</button>
  </div>
  <button class="icon-btn" onclick="logout()" data-t="common.logout">خروج 🚪</button>
</div>

<!-- ═══ الإحصائيات ═══ -->
<div class="stats">
  <div class="stat"><b id="stOrders">0</b><small data-t="supervisor.stats.todayOrders">طلبات اليوم</small></div>
  <div class="stat"><b id="stRevenue">0</b><small data-t="supervisor.stats.todayRevenue">مبيعات اليوم (ريال)</small></div>
  <div class="stat"><b id="stDrivers">0</b><small data-t="supervisor.stats.availableDrivers">سائقون متاحون</small></div>
</div>

<div class="wrap">

  <div class="sec-title">🔔 <span data-t="supervisor.sections.newOrders">طلبات جديدة</span> <span class="pill" id="cntNew">0</span></div>
  <div id="listNew"></div>

  <div class="sec-title">🍳 <span data-t="supervisor.sections.inProgress">قيد التنفيذ</span> <span class="pill" id="cntProg">0</span></div>
  <div id="listProgress"></div>

  <div class="sec-title">🚗 <span data-t="supervisor.sections.activeDelivery">توصيلات نشطة</span> <span class="pill" id="cntActive">0</span></div>
  <div id="listActive"></div>

  <div class="sec-title">✅ <span data-t="supervisor.sections.deliveredToday">سُلّم اليوم</span> <span class="pill" id="cntDone">0</span></div>
  <div id="listDone"></div>

</div>

<div id="reportArea"></div>
<div id="toast"></div>

<!-- بيانات الفروع (للأسماء الإنجليزية) + الترجمة المركزية -->
<script src="settings.js"></script>
<script src="i18n-staff.js"></script>

<script>
/* ═══════════════════════════════════════════
   إعدادات الربط
   ═══════════════════════════════════════════ */
const API_BASE = 'https://makaronjy-api.makaronjy.workers.dev';
const REFRESH_MS = 7000;

let TOKEN = localStorage.getItem('mk_staff_token');
let USER = null;
try { USER = JSON.parse(localStorage.getItem('mk_staff_user') || 'null'); } catch(e){}
let DRIVERS = [];
let LAST_ORDERS = [];
let knownPending = new Set();
let soundOn = localStorage.getItem('sup_sound') !== 'off';
let audioCtx = null;

/* ─── حماية الصفحة ─── */
(function guard() {
  if (!TOKEN || !USER) { location.href = 'login.html'; return; }
  if (USER.role !== 'supervisor' && USER.role !== 'super_admin') { location.href = 'login.html'; return; }
  if (USER.mustChangePassword) { location.href = 'login.html'; return; }
  if (USER.role === 'super_admin') {
    if (!confirm('أنت المالك – لوحتك الشاملة في admin.html\nهل تريد البقاء في عرض المشرف؟')) {
      location.href = 'admin.html'; return;
    }
  }
  document.getElementById('supName').textContent = USER.name || '—';
  document.getElementById('supBranch').textContent = USER.branchName || '—';
  updateSoundBtn();
})();

/* ═══════════════════════════════════════════
   v2.2: أدوات الترجمة الكاملة
   ═══════════════════════════════════════════ */
function pickLang(lang){ setStaffLang(lang); }
function syncLangUI(){
  const lang = getStaffLang();
  document.getElementById('langAr').classList.toggle('active', lang === 'ar');
  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  if (typeof applyStaffI18n === 'function') applyStaffI18n();
}
function cur(){ return tt('common.riyal'); }
function isEn(){ return getStaffLang() === 'en'; }
/* اسم الصنف حسب اللغة (الجديدة ثنائية، القديمة كما هي) */
function itemNameL(i){
  return (isEn() && i && i.name_en) ? i.name_en : (i ? i.name : '');
}
/* اسم الفرع حسب اللغة (من settings.js) */
function brDisplayName(o){
  if (isEn()) {
    try {
      const list = (window.APP_SETTINGS && APP_SETTINGS.branches) || [];
      const b = list.find(x => (o.branch_id && x.id === o.branch_id) || (x.nameAr === o.branch_name));
      if (b && b.nameEn) return b.nameEn;
    } catch(e){}
  }
  return o.branch_name || '';
}
/* نص الحالة مترجماً (مع مراعاة الاستلام) */
function statusLbl(o){
  let k = o.status;
  if (o.order_type === 'pickup') {
    if (o.status === 'ready') k = 'ready_pickup';
    if (o.status === 'delivered') k = 'delivered_pickup';
  }
  const t = tt('admin.statuses.' + k);
  return (t && t !== ('admin.statuses.' + k)) ? t : (o.status_text || o.status);
}
/* تاريخ حسب اللغة */
function fmtWhen(t){
  if(!t) return '';
  try{
    const d = new Date(String(t).replace(' ', 'T'));
    return d.toLocaleString(isEn() ? 'en-GB' : 'ar-SA',
      {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  }catch(e){ return String(t).slice(0,16); }
}

/* ─── غلاف API ─── */
async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + TOKEN,
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) {
    localStorage.removeItem('mk_staff_token');
    localStorage.removeItem('mk_staff_user');
    location.href = 'login.html';
    throw new Error('unauthorized');
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || tt('common.error'));
  return data;
}

/* ─── توست ─── */
function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  document.getElementById('toast').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ─── تنبيه صوتي ─── */
function beep() {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
    o.start(); o.stop(audioCtx.currentTime + 0.65);
  } catch (e) {}
}
function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem('sup_sound', soundOn ? 'on' : 'off');
  updateSoundBtn();
  if (soundOn) beep();
}
function updateSoundBtn() {
  const b = document.getElementById('soundBtn');
  b.textContent = soundOn ? '🔊' : '🔇';
  b.classList.toggle('off', !soundOn);
}

/* ─── واتساب ─── */
function normalizePhone(p) {
  const d = (p || '').replace(/\D/g, '');
  if (d.startsWith('0')) return '966' + d.slice(1);
  if (d.startsWith('966')) return d;
  return d;
}
function waOpen(phone, msg) {
  const url = 'https://wa.me/' + normalizePhone(phone) + '?text=' + encodeURIComponent(msg);
  const w = window.open(url, '_blank');
  if (!w) location.href = url;
}
/* رسالة تأكيد الاستلام المعتمدة */
function waConfirm(o) {
  const msg = tt('messages.supConfirm', {
    customer_name: o.customer_name,
    supervisor_name: USER.name || '—',
    branch_name: USER.branchName || o.branch_name || '—',
    order_number: o.number,
    total: o.total
  });
  waOpen(o.customer_phone, msg);
}

/* ─── نوع الطلب ─── */
function isPickup(o) { return o.order_type === 'pickup'; }
function typeBadge(o) {
  return isPickup(o)
    ? '<span class="oc-type pickup">' + tt('supervisor.badges.pickup') + '</span>'
    : '<span class="oc-type delivery">' + tt('supervisor.badges.delivery') + '</span>';
}

/* ─── تحميل البيانات ─── */
async function loadAll(first) {
  try {
    const [ordersRes, driversRes] = await Promise.all([
      api('/api/supervisor/orders'),
      api('/api/supervisor/drivers'),
    ]);
    DRIVERS = driversRes.drivers || [];
    LAST_ORDERS = ordersRes.orders || [];
    if (!USER.branchName && ordersRes.branch_name) {
      USER.branchName = ordersRes.branch_name;
      try { localStorage.setItem('mk_staff_user', JSON.stringify(USER)); } catch(e){}
      document.getElementById('supBranch').textContent = USER.branchName;
    }
    if (!USER.name && ordersRes.supervisor_name) {
      USER.name = ordersRes.supervisor_name;
      try { localStorage.setItem('mk_staff_user', JSON.stringify(USER)); } catch(e){}
      document.getElementById('supName').textContent = USER.name;
    }
    render(first);
  } catch (e) {
    if (e.message !== 'unauthorized') toast(tt('supervisor.toast.updateFailed'), 'err');
  }
}

/* ─── العرض ── */
function render(first) {
  const orders = LAST_ORDERS;

  const isNew = o => o.status === 'pending';
  const isProg = o => ['accepted', 'preparing', 'ready'].includes(o.status);
  const isActive = o => ['driver_assigned', 'driver_at_restaurant', 'out_for_delivery'].includes(o.status);
  const isDone = o => o.status === 'delivered';

  const news = orders.filter(isNew);
  const progs = orders.filter(isProg);
  const actives = orders.filter(isActive);
  const dones = orders.filter(isDone);

  if (!first) {
    let newOne = false;
    news.forEach(o => {
      if (!knownPending.has(o.number)) { newOne = true; knownPending.add(o.number); }
    });
    if (newOne) beep();
  } else {
    news.forEach(o => knownPending.add(o.number));
  }

  document.getElementById('cntNew').textContent = news.length;
  document.getElementById('cntProg').textContent = progs.length;
  document.getElementById('cntActive').textContent = actives.length;
  document.getElementById('cntDone').textContent = dones.length;
  const bellCnt = document.getElementById('bellCnt');
  bellCnt.hidden = news.length === 0;
  bellCnt.textContent = news.length;

  document.getElementById('stOrders').textContent = orders.length;
  document.getElementById('stRevenue').textContent =
    dones.reduce((s, o) => s + o.total, 0);
  document.getElementById('stDrivers').textContent = DRIVERS.length;

  document.getElementById('listNew').innerHTML =
    news.length ? news.map(o => cardNew(o)).join('') :
    '<div class="empty">' + tt('supervisor.empty.newOrders') + '</div>';

  document.getElementById('listProgress').innerHTML =
    progs.length ? progs.map(o => cardProgress(o)).join('') :
    '<div class="empty">' + tt('supervisor.empty.inProgress') + '</div>';

  document.getElementById('listActive').innerHTML =
    actives.length ? actives.map(o => cardActive(o)).join('') :
    '<div class="empty">' + tt('supervisor.empty.activeDelivery') + '</div>';

  document.getElementById('listDone').innerHTML =
    dones.length ? dones.slice(0, 20).map(o => cardDone(o)).join('') :
    '<div class="empty">' + tt('supervisor.empty.deliveredToday') + '</div>';
}

/* ─── بطاقة طلب جديد ─── */
function cardNew(o) {
  return `
  <div class="order-card new">
    <div class="oc-head">
      <span class="oc-num">${o.number}</span>
      ${typeBadge(o)}
      <span class="oc-cust">👤 ${o.customer_name}</span>
      <a class="oc-phone" href="tel:${o.customer_phone}">${o.customer_phone}</a>
      <span class="oc-total">${o.total} ${cur()}</span>
    </div>
    ${o.customer_address ? `<div class="oc-line"><span class="lbl">📍 ${tt('supervisor.labels.address')}:</span> ${o.customer_address}
      ${o.customer_lat ? `— <a class="map-link" target="_blank" href="https://www.google.com/maps?q=${o.customer_lat},${o.customer_lng}">${tt('supervisor.actions.viewMap')} 🗺️</a>` : ''}</div>` : ''}
    <div class="oc-items">${o.items.map(i => `▪️ ${i.qty}× ${itemNameL(i)}${i.size ? ' (' + i.size + ')' : ''} — ${i.qty * i.price} ${cur()}`).join('<br>')}</div>
    ${o.notes ? `<div class="oc-note">📝 ${o.notes}</div>` : ''}
    <div class="oc-line"><span class="lbl">💵 ${tt('supervisor.labels.payment')}:</span> ${isPickup(o) ? tt('supervisor.badges.payment.atCashier') : (o.payment_method === 'cod' ? tt('supervisor.badges.payment.cod') : tt('supervisor.badges.payment.card'))}</div>
    <div class="oc-actions">
      <button class="btn btn-ok" onclick="act(${o.id},'accepted')">${tt('supervisor.actions.confirm')}</button>
      <button class="btn btn-err" onclick="act(${o.id},'cancelled')">${tt('supervisor.actions.reject')}</button>
      <button class="btn btn-wa" onclick='waConfirm(${JSON.stringify(o).replace(/"/g, "&quot;")})'>${tt('supervisor.actions.waVerify')}</button>
    </div>
  </div>`;
}

/* ─── بطاقة قيد التنفيذ ─── */
function cardProgress(o) {
  let actions = '';
  let poolInfo = '';

  if (o.status === 'accepted') {
    actions =
      `<button class="btn btn-gold" onclick="act(${o.id},'preparing')">${tt('supervisor.actions.preparing')}</button>
       <button class="btn btn-wa" onclick='waConfirm(${JSON.stringify(o).replace(/"/g, "&quot;")})'>${tt('supervisor.actions.waVerify')}</button>`;
  } else if (o.status === 'preparing') {
    actions = `<button class="btn btn-gold" onclick="act(${o.id},'ready')">${isPickup(o) ? tt('supervisor.actions.readyForPickup') : tt('supervisor.actions.ready')}</button>`;
  } else if (o.status === 'ready') {
    if (isPickup(o)) {
      actions = `
        <button class="btn btn-ok" onclick="act(${o.id},'delivered')">${tt('supervisor.actions.pickupFromBranch')}</button>
        <span class="oc-type pickup" style="align-self:center">${tt('supervisor.actions.pickupHint')} ${o.total} ${tt('supervisor.actions.atCashier')}</span>`;
    } else {
      poolInfo = `
        <div class="pool-info">
          <div class="ico">📦</div>
          <div class="txt">
            <b>${tt('supervisor.actions.sendToPool').replace('📦 ', '')}</b>
            <small>${isEn() ? 'Available to all branch drivers — first to claim delivers it' : 'الطلب متاح لجميع سائقي الفرع — من يختاره أولاً يوصّله'}</small>
          </div>
          <button class="pool-toggle" onclick="togglePoolAssign(${o.id})">${tt('supervisor.actions.assignDriver')} ↴</button>
        </div>
        <div class="pool-assign-wrap" id="poolWrap-${o.id}">
          <small>${isEn() ? '🔧 Manual fallback (driver without app):' : '🔧 تعيين يدوي احتياطي (سائق بدون التطبيق):'}</small>
          <div class="oc-actions">
            <select class="sel" id="drv-${o.id}">
              <option value="">${tt('supervisor.actions.chooseDriver')}</option>
              ${DRIVERS.map(d => `<option value="${d.id}">${d.name}</option>`).join('')}
            </select>
            <button class="btn btn-blue" onclick="assign(${o.id})">${tt('supervisor.actions.assignDriver')}</button>
          </div>
        </div>`;
    }
  }
  return `
  <div class="order-card${o.status === 'ready' && !isPickup(o) ? ' pool' : ''}">
    <div class="oc-head">
      <span class="oc-num">${o.number}</span>
      ${typeBadge(o)}
      <span class="oc-cust">👤 ${o.customer_name}</span>
      <span class="oc-total">${o.total} ${cur()}</span>
    </div>
    <div class="oc-line"><span class="lbl">${tt('supervisor.labels.status')}:</span> ${statusLbl(o)}</div>
    ${poolInfo}
    ${actions ? `<div class="oc-actions">${actions}</div>` : ''}
  </div>`;
}

function togglePoolAssign(id) {
  const w = document.getElementById('poolWrap-' + id);
  if (w) w.classList.toggle('show');
}

/* ─── بطاقة توصيل نشط ─── */
function cardActive(o) {
  const mapLink = (o.driver_lat && o.driver_lng)
    ? `<a class="map-link" target="_blank" href="https://www.google.com/maps?q=${o.driver_lat},${o.driver_lng}">${tt('supervisor.actions.driverLocation')}</a>`
    : '';
  return `
  <div class="order-card">
    <div class="oc-head">
      <span class="oc-num">${o.number}</span>
      ${typeBadge(o)}
      <span class="oc-cust">🚗 ${o.driver_name || tt('supervisor.actions.unknownDriver')}</span>
      ${o.driver_phone ? `<a class="oc-phone" href="tel:${o.driver_phone}">${o.driver_phone}</a>` : ''}
    </div>
    <div class="oc-line"><span class="lbl">👤 ${tt('supervisor.labels.customer')}:</span> ${o.customer_name} — <a class="oc-phone" href="tel:${o.customer_phone}">${o.customer_phone}</a></div>
    <div class="oc-line"><span class="lbl">${tt('supervisor.labels.status')}:</span> ${statusLbl(o)} ${mapLink}</div>
    <div class="oc-line"><a class="map-link" target="_blank" href="track.html?order=${encodeURIComponent(o.number)}">${tt('supervisor.actions.openTracking')}</a></div>
  </div>`;
}

/* ─── بطاقة تسليم ─── */
function cardDone(o) {
  return `
  <div class="order-card">
    <div class="oc-head">
      <span class="oc-num">${o.number}</span>
      ${typeBadge(o)}
      <span class="oc-cust">👤 ${o.customer_name}</span>
      <span class="oc-total">${o.total} ${cur()}</span>
    </div>
    <div class="oc-line"><span class="lbl">🚗 ${tt('supervisor.labels.driver')}:</span> ${isPickup(o) ? tt('supervisor.badges.pickup') : (o.driver_name || '—')}</div>
  </div>`;
}

/* ─── تغيير حالة ─── */
async function act(id, status) {
  if (status === 'cancelled' && !confirm(tt('supervisor.actions.confirmReject'))) return;
  if (status === 'delivered' && !confirm(tt('supervisor.actions.confirmPickup'))) return;
  try {
    await api(`/api/orders/${id}/status`, {
      method: 'PUT',
      body: JSON.stringify({ status }),
    });
    toast(tt('supervisor.toast.statusUpdated'), 'ok');
    loadAll(false);
  } catch (e) {
    toast('⚠️ ' + e.message, 'err');
  }
}

/* ─── تعيين يدوي احتياطي ─── */
async function assign(id) {
  const sel = document.getElementById('drv-' + id);
  const driverId = sel ? sel.value : '';
  if (!driverId) { toast(tt('supervisor.toast.chooseDriverFirst'), 'err'); return; }
  try {
    const r = await api(`/api/orders/${id}/assign`, {
      method: 'PUT',
      body: JSON.stringify({ driver_id: parseInt(driverId) }),
    });
    toast(tt('supervisor.toast.driverAssigned') + ': ' + r.driver_name, 'ok');
    loadAll(false);
  } catch (e) {
    toast('⚠️ ' + e.message, 'err');
  }
}

/* ─── تقرير الطباعة (v2.2: توابع اللغة) ─── */
function printReport() {
  const orders = LAST_ORDERS;
  const done = orders.filter(o => o.status === 'delivered');
  const revenue = done.reduce((s, o) => s + o.total, 0);
  const fees = done.reduce((s, o) => s + o.delivery_fee, 0);

  document.getElementById('reportArea').innerHTML = `
    <h2>🍝 ${tt('supervisor.report.title')} ${brDisplayName(orders[0] || {}) || USER.branchName || ''}</h2>
    <p>${tt('supervisor.report.date')}: ${new Date().toLocaleString(isEn() ? 'en-GB' : 'ar-SA')}</p>
    <p>${tt('supervisor.report.totalOrders')}: ${orders.length} | ${tt('supervisor.report.delivered')}: ${done.length} | ${tt('supervisor.report.revenue')}: ${revenue} ${cur()} | ${tt('supervisor.report.fees')}: ${fees} ${cur()}</p>
    <table>
      <tr>
        <th>${tt('supervisor.report.columns.orderNum')}</th>
        <th>${tt('supervisor.report.columns.type')}</th>
        <th>${tt('supervisor.report.columns.customer')}</th>
        <th>${tt('supervisor.report.columns.phone')}</th>
        <th>${tt('supervisor.report.columns.total')}</th>
        <th>${tt('supervisor.report.columns.status')}</th>
        <th>${tt('supervisor.report.columns.driver')}</th>
      </tr>
      ${orders.map(o => `
        <tr>
          <td>${o.number}</td>
          <td>${isPickup(o) ? (isEn()?'Pickup':'استلام') : (isEn()?'Delivery':'توصيل')}</td>
          <td>${o.customer_name}</td>
          <td>${o.customer_phone}</td>
          <td>${o.total}</td>
          <td>${statusLbl(o)}</td>
          <td>${isPickup(o) ? '🏪' : (o.driver_name || '—')}</td>
        </tr>`).join('')}
    </table>
    <p style="margin-top:1rem">${tt('supervisor.report.savePdfHint')}</p>
  `;
  window.print();
}

/* ─── خروج ─── */
function logout() {
  if (!confirm(tt('supervisor.confirmLogout'))) return;
  localStorage.removeItem('mk_staff_token');
  localStorage.removeItem('mk_staff_user');
  location.href = 'login.html';
}

/* ─── الإقلاع ─── */
initStaffI18n({ autoLangToggle: false }); /* الزر مدمج بالهيدر */
syncLangUI();
window.addEventListener('staff-lang-changed', function(){
  syncLangUI();
  render(false);
});
loadAll(true);
setInterval(() => loadAll(false), REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadAll(false);
});
</script>

</body>
</html>
