# ═══════════════════════════════════════════
#  مكرونجي - إعدادات Cloudflare Worker
#  نظام تتبع الطلبات الحي
# ═══════════════════════════════════════════

# ───────────────────────────────────────────
#  الإعدادات الأساسية
# ───────────────────────────────────────────
name = "makaronjy-api"
main = "worker/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ───────────────────────────────────────────
#  إعدادات النشر
#  ملاحظة: تم إزالة [site] لأن المشروع API فقط
#  ولا يحتاج إلى مجلد public للملفات الثابتة
# ───────────────────────────────────────────

# ───────────────────────────────────────────
#  المتغيرات البيئية العامة (غير السرية)
#  هذه تظهر في الكود - لا تضع فيها أشياء حساسة
# ───────────────────────────────────────────
[vars]
# رابط الموقع الرئيسي
SITE_URL = "https://makaronjy.pages.dev"

# وضع التتبع الحي: "polling" (مجاني) أو "websocket" (مدفوع)
LIVE_MODE = "polling"

# ⚠️ المتغيّرات الأربعة أدناه غير مقروءة في الكود حالياً
#    الووركر يستخدم قيماً مثبّتة بدلاً منها. وجودها لا يضر
#    لكن تغييرها هنا لن يغيّر السلوك. (تفصيل في نهاية الملف)
SESSION_DURATION = 2592000      # غير مستخدم — الجلسات تُكتب ولا تُقرأ للتحقق
MAX_LOGIN_ATTEMPTS = 5          # غير مستخدم — الكود يثبّت 5 مباشرة
LOCKOUT_DURATION = 900          # غير مستخدم — الكود يثبّت 900 ثانية
RATE_LIMIT_PER_MINUTE = 100     # غير مستخدم — الكود يثبّت حدوداً لكل مسار

# مدة صلاحية JWT (بالثواني) - 7 أيام  ✅ هذا مقروء فعلاً
JWT_DURATION = 604800

# ───────────────────────────────────────────
#  المراقبة والسجلات (Observability)
#  ⚠️ مهم: هذا القسم يمنع لوحة التحكم من فقدان
#     إعداد Logs عند كل نشر عبر wrangler deploy
# ───────────────────────────────────────────
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false

# ───────────────────────────────────────────
#  قاعدة البيانات D1
# ───────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "makaronjy-db"
database_id = "3f787004-ecef-4fee-8b6a-d46da70aca7a"

# ───────────────────────────────────────────
#  تخزين R2 (للصور والنسخ الاحتياطي)
#  ⚠️ حاويتا *-preview غير موجودتين في حسابك
#     (الحساب فيه makaronjy-images و makaronjy-backups فقط)
#     هذا لا يؤثر على الإنتاج، لكنه يُفشل wrangler dev --remote
#     ومعاينات الفروع. الحل: أنشئ الحاويتين أو احذف السطرين.
# ───────────────────────────────────────────
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "makaronjy-images"
preview_bucket_name = "makaronjy-images-preview"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "makaronjy-backups"
preview_bucket_name = "makaronjy-backups-preview"

# ───────────────────────────────────────────
#  KV Storage (للـ Rate Limiting والـ Cache)
# ───────────────────────────────────────────
[[kv_namespaces]]
binding = "KV"
id = "51fcd19c06fc46e5a68dd5e429cd132f"

# ───────────────────────────────────────────
#  Cron Triggers (المهام المجدولة)
#  ✅ تعمل على الخطة المجانية أيضاً
#     (لوحتك تؤكّد: Next Tue 17 Nov 2026 03:00:00)
#  التوقيت UTC — 3 فجراً UTC = 6 صباحاً الرياض
#  وهو وقت مثالي: المطعم مغلق منذ 2-3 صباحاً
# ───────────────────────────────────────────
[triggers]
crons = [
  "0 3 * * *",   # يومياً: تنظيف + نسخ احتياطي + تفريغ المهملات
  "0 */6 * * *"  # كل 6 ساعات: تنظيف الطلبات المعلّقة القديمة
]

# ───────────────────────────────────────────
#  إعدادات البيئة المختلفة
#
#  ⚠️⚠️ تحذير مهم جداً ⚠️⚠️
#  في Wrangler البيئات المسماة لا ترث bindings المستوى الأعلى.
#  أي أن النشر بـ:  npx wrangler deploy --env production
#  سينشئ ووركر بلا DB ولا IMAGES ولا BACKUPS ولا KV
#  → النظام يتوقف بالكامل.
#
#  ✅ أمر النشر الصحيح (المستخدم حالياً في لوحتك):
#     npx wrangler deploy
#     بلا --env إطلاقاً — يستخدم كل ما سبق في هذا الملف.
#
#  لا تستخدم --env إلا بعد نسخ كل الـbindings داخل الكتلة.
# ───────────────────────────────────────────

# بيئة التطوير (Development)
[env.dev]
name = "makaronjy-api-dev"
vars = { ENVIRONMENT = "development", LIVE_MODE = "polling" }

# بيئة الإنتاج (Production)
[env.production]
name = "makaronjy-api"
vars = { ENVIRONMENT = "production", LIVE_MODE = "polling" }

# ═══════════════════════════════════════════
#  ⚠️ المتغيرات السرية (Secrets)
#  ═══════════════════════════════════════════
#
#  هذه لا تُكتب هنا! تُضاف عبر Cloudflare Dashboard:
#  Workers → makaronjy-api → Settings → Variables and secrets
#
#  1) JWT_SECRET      ✅ موجود — توقيع رموز الدخول
#
#  2) RECOVERY_KEY    🔴 مفقود — يجب إضافته فوراً
#     بدونه لا توجد أي طريقة لاستعادة كلمة مرور المالك
#     لو نسيتها. الووركر يرفض الاستعادة بـ 403 صراحةً:
#       if (!env.RECOVERY_KEY) return error('...', 403)
#
#     لتوليد قيمة قوية — الصق هذا في Console المتصفح:
#       crypto.getRandomValues(new Uint8Array(24))
#         .reduce((s,b)=>s+b.toString(16).padStart(2,'0'),'')
#
#     احفظ الناتج خارج الجوال (مدير كلمات مرور / ورقة).
#     الاستخدام عند الحاجة:
#       /api/recover-owner?key=<سرك>&new=NewPass123
#
#  هذه الأسرار تُخزن مشفرة في Cloudflare
#  ولا يمكن لأحد رؤيتها (حتى أنت)
#
# ═══════════════════════════════════════════
