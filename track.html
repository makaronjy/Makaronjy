<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title data-t="track.pageTitle">تتبع الطلب | مكرونجي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--brown:#8e2a4a;--dark:#5a1830;--gold:#e0912f;--gold2:#f2b95f;--cream:#faf3ea;--card:#fffdf9;--ink:#2b1a15;--muted:#8a6f63;--line:#eadfd2;--ok:#1e5b4f;--okbg:#dcf5e8;--err:#b91c1c;--errbg:#fee2e2;--warn:#a06b1c;--warnbg:#fff6e6;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;padding-bottom:2rem}
/* ─── الهيدر (v2.4: زر لغة مدمج) ─── */
.top{background:linear-gradient(135deg,var(--dark),var(--brown));color:#fff;padding:1rem 1rem}
.top-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;max-width:560px;margin:0 auto;gap:.5rem}
.top-txt{grid-column:2;text-align:center}
.top-txt b{font-size:1.05rem;font-weight:900}
.top-txt small{display:block;color:var(--gold2);font-size:.7rem;font-weight:800;margin-top:.15rem}
.lang-toggle{
  grid-column:3;justify-self:end;
  display:inline-flex;background:#ffffff14;border:1px solid #ffffff2b;
  border-radius:50px;padding:3px;gap:2px;
}
.lang-toggle button{
  padding:.3rem .72rem;border-radius:50px;border:none;
  background:transparent;color:#ffffffb0;
  font-family:inherit;font-weight:900;font-size:.72rem;cursor:pointer;
}
.lang-toggle button.active{
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark);
}
.wrap{max-width:560px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:1.1rem;margin-bottom:.9rem;box-shadow:0 4px 14px rgba(90,24,48,.06)}
.hidden{display:none !important}
.numbox{text-align:center}
.numbox .ico{font-size:2.6rem}
.numbox .num{display:inline-block;background:var(--dark);color:var(--gold2);border-radius:50px;padding:.35rem 1.4rem;font-weight:900;font-size:1.3rem;direction:ltr;margin:.5rem 0 .3rem}
.pill{display:inline-block;border-radius:50px;padding:.3rem 1rem;font-size:.8rem;font-weight:900;margin-top:.3rem}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.err{background:var(--errbg);color:var(--err)}
.pill.info{background:#e3f2fd;color:#1565c0}
.note{margin-top:.6rem;background:var(--warnbg);border-radius:10px;padding:.55rem .7rem;font-size:.78rem;font-weight:800;color:var(--warn);line-height:1.8}
.note.err{background:var(--errbg);color:var(--err)}
/* الخطوات */
.steps{display:flex;flex-direction:column;gap:0;margin-top:.4rem}
.step{display:flex;gap:.8rem;position:relative;padding-bottom:1.15rem}
.step:last-child{padding-bottom:0}
.step .rail{position:absolute;top:34px;bottom:0;right:16px;width:3px;background:var(--line);border-radius:3px}
.step:last-child .rail{display:none}
.step.done .rail{background:var(--ok)}
.step .dot{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;background:#fff;border:2px solid var(--line);color:var(--muted);z-index:1}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.now .dot{background:var(--gold);border-color:var(--gold);color:var(--dark);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,145,47,.45)}50%{box-shadow:0 0 0 9px rgba(224,145,47,0)}}
.step .txt b{display:block;font-size:.86rem;font-weight:900;color:var(--muted)}
.step.done .txt b,.step.now .txt b{color:var(--ink)}
/* بطاقات */
.row{display:flex;align-items:center;gap:.7rem;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:.7rem .8rem;margin-top:.6rem}
.row .ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:var(--cream)}
.row .inf{flex:1;min-width:0}
.row .inf b{display:block;font-size:.85rem;font-weight:900}
.row .inf small{color:var(--muted);font-size:.7rem;font-weight:700;display:block;line-height:1.6}
.row a.btn{border:none;border-radius:10px;padding:.5rem .8rem;font-family:inherit;font-size:.75rem;font-weight:900;text-decoration:none;white-space:nowrap}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark)}
.btn.green{background:var(--ok);color:#fff}
/* الخريطة */
#mapBox{height:250px;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);margin-top:.6rem;z-index:1}
.routeinfo{margin-top:.5rem;background:var(--warnbg);border:1px dashed var(--gold);border-radius:10px;padding:.45rem .7rem;font-size:.75rem;font-weight:900;color:var(--warn);text-align:center}
.maplegend{display:flex;gap:.8rem;justify-content:center;font-size:.68rem;font-weight:800;color:var(--muted);margin-top:.5rem;flex-wrap:wrap}
.mk-pin-ico{font-size:26px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
/* الشاشة الختامية */
.final{text-align:center;padding:.6rem 0}
.final .big{font-size:4rem;animation:pop2 .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop2{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.final h2{color:var(--ok);font-size:1.25rem;font-weight:900;margin:.5rem 0 .3rem}
.final p{color:var(--muted);font-size:.85rem;font-weight:800;line-height:1.8;margin:.2rem 0}
.final .closeBtn{display:block;width:100%;border:none;border-radius:14px;padding:.95rem;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark);font-family:inherit;font-weight:900;font-size:1rem;cursor:pointer;margin-top:1rem}
/* الأصناف */
.items h4{font-size:.85rem;font-weight:900;color:var(--brown);margin-bottom:.5rem}
.it{display:flex;justify-content:space-between;gap:.5rem;font-size:.8rem;font-weight:800;padding:.35rem 0;border-bottom:1px dashed var(--line)}
.it:last-of-type{border-bottom:none}
.tot{display:flex;justify-content:space-between;font-size:.82rem;font-weight:800;padding:.25rem 0;color:var(--muted)}
.tot.grand{color:var(--ink);font-size:.95rem;font-weight:900;border-top:1.5px solid var(--line);margin-top:.3rem;padding-top:.5rem}
.auto{text-align:center;color:var(--muted);font-size:.68rem;font-weight:800;margin-top:.8rem}
.load{text-align:center;padding:3rem 1rem;color:var(--muted);font-weight:900}
.spin{display:inline-block;width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:.7rem}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ═══ الهيدر (v2.4) ═══ -->
<div class="top">
  <div class="top-row">
    <div></div>
    <div class="top-txt">
      <b>🍝 <span data-t="login.brand">مكرونجي</span></b>
      <small data-t="track.subtitle">تتبع طلبك لحظة بلحظة</small>
    </div>
    <div class="lang-toggle">
      <button id="langAr" class="active" onclick="pickLang('ar')">AR</button>
      <button id="langEn" onclick="pickLang('en')">EN</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="box" class="card"><div class="load"><span class="spin"></span><br><span data-t="track.loading">جارٍ تحميل طلبك...</span></div></div>

  <div id="mapCard" class="card hidden">
    <b style="font-size:.9rem;font-weight:900;color:var(--brown)" data-t="track.map.title">🗺️ خريطة التتبع المباشر</b>
    <div id="mapBox"></div>
    <div id="routeInfo" class="routeinfo hidden"></div>
    <div class="maplegend">
      <span data-t="track.map.legend.driver">🛵 السائق</span>
      <span data-t="track.map.legend.target">📍 وجهتك</span>
      <span data-t="track.map.legend.branch">🏪 الفرع</span>
    </div>
  </div>
</div>

<!-- بيانات الفروع (للأسماء الإنجليزية) + الترجمة المركزية -->
<script src="settings.js"></script>
<script src="i18n-staff.js"></script>

<script>
const CLOUD_API = 'https://makaronjy-api.makaronjy.workers.dev';

const DELIVERY_KEYS = ['pending','accepted','preparing','ready','out_for_delivery','delivered'];
const PICKUP_KEYS   = ['pending','accepted','preparing','ready','delivered'];

let LAST_DATA = null;

/* ═══════════════════════════════════════════
   v2.4: أدوات اللغة الكاملة
   ═══════════════════════════════════════════ */
function pickLang(lang){ setStaffLang(lang); }
function syncLangUI(){
  const lang = getStaffLang();
  document.getElementById('langAr').classList.toggle('active', lang === 'ar');
  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  if (typeof applyStaffI18n === 'function') applyStaffI18n();
}
function isEn(){ return getStaffLang() === 'en'; }
function cur(){ return tt('common.riyal'); }
function itemNameL(i){
  return (isEn() && i && i.name_en) ? i.name_en : (i ? i.name : '');
}
/* اسم الفرع حسب اللغة (من settings.js) */
function brDisplayName(br){
  if(!br) return '';
  if(isEn()){
    try{
      const list = (window.APP_SETTINGS && APP_SETTINGS.branches) || [];
      const b = list.find(x => x.nameAr === br.name);
      if(b && b.nameEn) return b.nameEn;
    }catch(e){}
  }
  return br.name || '';
}
function fmtTime(t){
  if(!t) return '';
  try{
    const d = new Date(String(t).replace(' ', 'T'));
    return d.toLocaleString(isEn() ? 'en-GB' : 'ar-SA',
      {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  }catch(e){ return String(t).slice(0,16); }
}
function statusLabel(o){
  let key = o.status;
  if(o.order_type === 'pickup'){
    if(o.status === 'ready') key = 'ready_pickup';
    if(o.status === 'delivered') key = 'delivered_pickup';
  }
  const t = tt('admin.statuses.' + key);
  return (t && t !== ('admin.statuses.' + key)) ? t : (o.status_text || o.status);
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function orderNum(){
  const q = new URLSearchParams(location.search).get('order');
  return q ? decodeURIComponent(q) : '';
}
function mapsLink(lat, lng){ return 'https://maps.google.com/?q=' + lat + ',' + lng; }

function stepsHtml(keys, dictPrefix, status){
  const displayStatus = (status === 'driver_assigned') ? 'out_for_delivery' : status;
  const orderIdx = keys.indexOf(displayStatus);
  const finished = (status === 'delivered' || status === 'archived');
  const curIdx = finished ? keys.length - 1 : orderIdx;
  return '<div class="steps">' + keys.map(function(k, i){
    let cls = 'step';
    if(finished || i < curIdx) cls += ' done';
    else if(i === curIdx) cls += ' done now';
    return '<div class="' + cls + '">' +
      '<div class="rail"></div>' +
      '<div class="dot">' + (i <= curIdx ? '✓' : tt('track.icons.' + k)) + '</div>' +
      '<div class="txt"><b>' + tt(dictPrefix + '.' + k) + '</b></div>' +
    '</div>';
  }).join('') + '</div>';
}

/* ═══════════════════════════════════════════
   الخريطة + المسار الحقيقي (OSRM)
   ═══════════════════════════════════════════ */
const OSRM_HOSTS = [
  'https://routing.openstreetmap.de/routed-car',
  'https://router.project-osrm.org'
];
let routeCache = { key:'', ts:0, coords:null, km:0, min:0 };

function routeKey(a, b){
  return a[0].toFixed(3) + ',' + a[1].toFixed(3) + '|' + b[0].toFixed(3) + ',' + b[1].toFixed(3);
}
async function fetchRoute(a, b){
  const key = routeKey(a, b);
  const now = Date.now();
  if(routeCache.key === key && routeCache.coords && (now - routeCache.ts) < 60000){
    return routeCache;
  }
  for(const host of OSRM_HOSTS){
    try{
      const url = host + '/route/v1/driving/' +
        a[1] + ',' + a[0] + ';' + b[1] + ',' + b[0] +
        '?overview=full&geometries=geojson&alternatives=false&steps=false';
      const r = await fetch(url, { cache:'no-store' });
      if(!r.ok) continue;
      const j = await r.json();
      const rt = j && j.routes && j.routes[0];
      if(!rt || !rt.geometry || !rt.geometry.coordinates) continue;
      const coords = rt.geometry.coordinates.map(c => [c[1], c[0]]);
      routeCache = {
        key: key, ts: now, coords: coords,
        km: (rt.distance || 0) / 1000,
        min: Math.max(1, Math.round((rt.duration || 0) / 60))
      };
      return routeCache;
    }catch(e){}
  }
  return null;
}

let map = null, mkDriver = null, mkTarget = null, mkBranch = null;
let routeLayer = null, straightLayer = null, mapFitted = false;

function pinIcon(emoji){
  return L.divIcon({
    className: '',
    html: '<div class="mk-pin-ico">' + emoji + '</div>',
    iconSize: [30, 30],
    iconAnchor: [15, 26]
  });
}
function initMap(){
  if(map || !window.L) return;
  try{
    map = L.map('mapBox', { scrollWheelZoom: false, zoomControl: true });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
  }catch(e){ map = null; }
}
function clearRouteLayers(){
  if(!map) return;
  if(routeLayer){ map.removeLayer(routeLayer); routeLayer = null; }
  if(straightLayer){ map.removeLayer(straightLayer); straightLayer = null; }
}
function clearMarkers(){
  if(!map) return;
  [mkDriver, mkTarget, mkBranch].forEach(function(mk){ if(mk){ map.removeLayer(mk); } });
  mkDriver = mkTarget = mkBranch = null;
  clearRouteLayers();
}
async function drawRoute(a, b){
  const info = document.getElementById('routeInfo');
  const rc = await fetchRoute(a, b);
  if(rc && rc.coords && rc.coords.length > 1){
    if(straightLayer){ map.removeLayer(straightLayer); straightLayer = null; }
    if(!routeLayer){
      routeLayer = L.polyline(rc.coords, { color:'#e0912f', weight:5, opacity:.9 }).addTo(map);
    } else {
      routeLayer.setLatLngs(rc.coords);
    }
    if(info){
      info.classList.remove('hidden');
      info.innerHTML = tt('track.map.routeInfo.remaining') + ': ' +
        rc.km.toFixed(1) + ' ' + tt('track.map.routeInfo.km') +
        ' • ⏱️ ~' + rc.min + ' ' + tt('track.map.routeInfo.minutes') +
        ' (' + tt('track.map.routeInfo.fastest') + ')';
    }
  } else {
    if(routeLayer){ map.removeLayer(routeLayer); routeLayer = null; }
    if(!straightLayer){
      straightLayer = L.polyline([a, b], { color:'#e0912f', weight:4, dashArray:'10 8', opacity:.85 }).addTo(map);
    } else {
      straightLayer.setLatLngs([a, b]);
    }
    if(info){
      info.classList.remove('hidden');
      info.innerHTML = tt('track.map.routeInfo.fallback');
    }
  }
}
function hideMap(){
  document.getElementById('mapCard').classList.add('hidden');
}
function updateMap(d){
  const card = document.getElementById('mapCard');
  const info = document.getElementById('routeInfo');
  const o = d.order, br = d.branch, dr = d.driver;
  const cancelled = (o.status === 'cancelled');
  const finalState = (o.status === 'delivered' || o.status === 'archived');
  if(!window.L || cancelled || finalState){ card.classList.add('hidden'); return; }

  const isPickup = (o.order_type === 'pickup');
  const branchPt = (br && typeof br.lat === 'number' && typeof br.lng === 'number') ? [br.lat, br.lng] : null;
  const custPt = (typeof o.customer_lat === 'number' && typeof o.customer_lng === 'number' && o.customer_lat)
    ? [o.customer_lat, o.customer_lng] : null;
  const driverPt = (dr && typeof dr.lat === 'number' && typeof dr.lng === 'number' && dr.lat)
    ? [dr.lat, dr.lng] : null;
  const brName = brDisplayName(br);

  if(isPickup){
    if(!branchPt){ card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    if(info) info.classList.add('hidden');
    initMap();
    if(!map) return;
    clearMarkers();
    mkBranch = L.marker(branchPt, { icon: pinIcon('🏪') }).addTo(map).bindPopup(esc(brName));
    if(!mapFitted){ map.setView(branchPt, 15); mapFitted = true; }
    return;
  }

  const targetPt = custPt || branchPt;
  if(!targetPt && !driverPt){ card.classList.add('hidden'); return; }
  card.classList.remove('hidden');
  initMap();
  if(!map) return;

  if(driverPt){
    if(!mkDriver){ mkDriver = L.marker(driverPt, { icon: pinIcon('🛵') }).addTo(map).bindPopup(tt('track.map.legend.driver')); }
    else mkDriver.setLatLng(driverPt);
  } else if(mkDriver){ map.removeLayer(mkDriver); mkDriver = null; }

  if(targetPt){
    if(!mkTarget){ mkTarget = L.marker(targetPt, { icon: pinIcon(custPt ? '📍' : '🏪') }).addTo(map).bindPopup(custPt ? tt('track.map.legend.target') : esc(brName)); }
    else mkTarget.setLatLng(targetPt);
  }
  if(custPt && branchPt && !mkBranch){
    mkBranch = L.marker(branchPt, { icon: pinIcon('🏪') }).addTo(map).bindPopup(esc(brName));
  }

  if(driverPt && targetPt){
    drawRoute(driverPt, targetPt);
  } else {
    clearRouteLayers();
    if(info) info.classList.add('hidden');
  }

  const pts = [driverPt, targetPt, branchPt].filter(Boolean);
  if(!mapFitted && pts.length){ map.fitBounds(pts, { padding: [36, 36] }); mapFitted = true; }
}

/* ═══════════════════════════════════════════
   v2.4: إغلاق سريع (محاولة إغلاق ← تحويل للرئيسية)
   ═══════════════════════════════════════════ */
function tryClosePage(){
  try{ window.close(); }catch(e){}
  setTimeout(function(){ location.href = 'index.html'; }, 250);
}

/* ═══════════════════════════════════════════
   العرض
   ═══════════════════════════════════════════ */
function receiptHtml(o, isPickup){
  if(!o.items || !o.items.length) return '';
  return '<div class="items" style="margin-top:1rem"><h4>' + tt('track.items.title') + '</h4>' +
    o.items.map(function(i){
      return '<div class="it"><span>' + i.qty + ' × ' + esc(itemNameL(i)) + (i.size ? ' (' + esc(i.size) + ')' : '') + '</span><span>' + (i.qty * i.price) + ' ' + cur() + '</span></div>';
    }).join('') +
    '<div class="tot" style="margin-top:.5rem"><span>' + tt('track.items.subtotal') + '</span><span>' + o.subtotal + ' ' + cur() + '</span></div>' +
    (isPickup ? '' : '<div class="tot"><span>' + tt('track.items.deliveryFee') + '</span><span>' + (o.delivery_fee || 0) + ' ' + cur() + '</span></div>') +
    '<div class="tot grand"><span>' + tt('track.items.grandTotal') + '</span><span>' + o.total + ' ' + cur() + '</span></div>' +
    '<div class="tot"><span>' + tt('track.items.paymentLabel') + '</span><span>' + (isPickup ? tt('track.items.payCashier') : tt('track.items.payDriver')) + '</span></div>' +
  '</div>';
}

function render(d){
  LAST_DATA = d;
  const o = d.order, br = d.branch, dr = d.driver;
  const isPickup = (o.order_type === 'pickup');
  const cancelled = (o.status === 'cancelled');
  const finalState = (o.status === 'delivered' || o.status === 'archived');
  const box = document.getElementById('box');
  const brName = brDisplayName(br);

  /* ─── الشاشة الختامية ─── */
  if(finalState){
    stopPolling();
    hideMap();
    box.innerHTML =
      '<div class="final">' +
        '<div class="big">🎉</div>' +
        '<h2>' + tt('track.closed.title') + '</h2>' +
        '<div class="numbox"><div class="num">' + esc(o.number) + '</div></div>' +
        '<p>' + tt('track.closed.thankYou') + '</p>' +
        '<button class="closeBtn" onclick="tryClosePage()">' + tt('track.closed.closeBtn') + '</button>' +
      '</div>' +
      receiptHtml(o, isPickup);
    box.dataset.filled = '1';
    return;
  }

  /* ─── الإلغاء ─── */
  if(cancelled){
    stopPolling();
    hideMap();
    const lastNote = (d.tracking && d.tracking.length) ? d.tracking[d.tracking.length - 1].notes : '';
    box.innerHTML =
      '<div class="final">' +
        '<div class="big">❌</div>' +
        '<h2 style="color:var(--err)">' + tt('track.closed.cancelled') + '</h2>' +
        '<div class="numbox"><div class="num">' + esc(o.number) + '</div></div>' +
        (lastNote ? '<div class="note err">⚠️ ' + esc(lastNote) + '</div>' : '') +
        '<button class="closeBtn" onclick="tryClosePage()">' + tt('track.closed.closeBtn') + '</button>' +
      '</div>';
    box.dataset.filled = '1';
    return;
  }

  /* ─── الحالة الحية ─── */
  let pillCls = 'info';
  if(o.status === 'ready' || o.status === 'out_for_delivery' || o.status === 'driver_assigned') pillCls = 'warn';

  let html = '';
  html += '<div class="numbox">' +
    '<div class="ico">' + (isPickup ? '🏪' : '🛵') + '</div>' +
    '<div class="num">' + esc(o.number) + '</div>' +
    '<div class="pill ' + pillCls + '">' + esc(statusLabel(o)) + '</div>' +
    '<div style="color:var(--muted);font-size:.7rem;font-weight:800;margin-top:.4rem">' +
      tt(isPickup ? 'track.orderTypeLabel.pickup' : 'track.orderTypeLabel.delivery') + ' • ' + fmtTime(o.created_at) +
    '</div>' +
  '</div>';

  html += '<div style="margin-top:1rem">' +
    stepsHtml(isPickup ? PICKUP_KEYS : DELIVERY_KEYS,
              isPickup ? 'track.stepsPickup' : 'track.stepsDelivery',
              o.status) +
  '</div>';

  if(!isPickup && dr && dr.name){
    html += '<div class="row">' +
      '<div class="ic">🚗</div>' +
      '<div class="inf"><b>' + esc(dr.name) + '</b><small>' + tt('track.driver.label') + (dr.last_update ? ' • ' + tt('track.driver.lastUpdate') + ' ' + fmtTime(dr.last_update) : '') + '</small></div>' +
      (dr.phone ? '<a class="btn green" href="tel:' + esc(dr.phone) + '">' + tt('track.driver.call') + '</a>' : '') +
    '</div>';
  }

  if(br && br.name){
    html += '<div class="row">' +
      '<div class="ic">' + (isPickup ? '🏪' : '🍝') + '</div>' +
      '<div class="inf"><b>' + esc(brName) + '</b><small>' + tt(isPickup ? 'track.branch.pickup' : 'track.branch.delivery') + '</small></div>' +
      (br.phone ? '<a class="btn green" href="tel:' + esc(br.phone) + '">' + tt('track.branch.call') + '</a>' : '') +
      ((br.lat && br.lng) ? '<a class="btn gold" href="' + mapsLink(br.lat, br.lng) + '" target="_blank" rel="noopener">' + tt('track.branch.arrival') + '</a>' : '') +
    '</div>';
  }

  html += receiptHtml(o, isPickup);

  if(o.notes){ html += '<div class="note">📝 ' + esc(o.notes) + '</div>'; }

  html += '<div class="auto">' + tt('track.autoUpdate') + '</div>';

  box.innerHTML = html;
  box.dataset.filled = '1';

  updateMap(d);
}

function renderError(msg){
  document.getElementById('box').innerHTML =
    '<div class="load">😕<br><br>' + esc(msg || tt('track.error.notFound')) + '<br><small style="font-weight:700">' + tt('track.error.checkLink') + '</small></div>';
  hideMap();
}

/* ═══════════════════════════════════════════
   التحديث التلقائي
   ═══════════════════════════════════════════ */
let timer = null;
function stopPolling(){
  if(timer){ clearInterval(timer); timer = null; }
}
async function load(){
  const num = orderNum();
  if(!num){ renderError(tt('track.error.noNumber')); return; }
  try{
    const r = await fetch(CLOUD_API + '/api/track/' + encodeURIComponent(num), { cache:'no-store' });
    const d = await r.json();
    if(!r.ok){ renderError(d.error || tt('track.error.notFound')); stopPolling(); return; }
    render(d);
    const done = (d.order.status === 'delivered' || d.order.status === 'archived' || d.order.status === 'cancelled');
    if(done){ stopPolling(); }
    else if(!timer){ timer = setInterval(load, 15000); }
  }catch(e){
    const box = document.getElementById('box');
    if(!box.dataset.filled){ renderError(tt('track.error.network')); }
  }
}

/* مزامنة اللغة: إعادة الرسم من آخر بيانات */
window.addEventListener('staff-lang-changed', function(){
  syncLangUI();
  if(LAST_DATA) render(LAST_DATA);
});

initStaffI18n({ autoLangToggle: false }); /* الزر مدمج بالهيدر */
syncLangUI();
document.addEventListener('DOMContentLoaded', function(){ load(); });
</script>
