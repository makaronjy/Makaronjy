
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>تتبع الطلب | مكرونجي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--brown:#8e2a4a;--dark:#5a1830;--gold:#e0912f;--gold2:#f2b95f;--cream:#faf3ea;--card:#fffdf9;--ink:#2b1a15;--muted:#8a6f63;--line:#eadfd2;--ok:#1e5b4f;--okbg:#dcf5e8;--err:#b91c1c;--errbg:#fee2e2;--warn:#a06b1c;--warnbg:#fff6e6;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;padding-bottom:2rem}
.top{background:linear-gradient(135deg,var(--dark),var(--brown));color:#fff;padding:1.1rem 1rem;text-align:center}
.top b{font-size:1.05rem;font-weight:900}
.top small{display:block;color:var(--gold2);font-size:.7rem;font-weight:800;margin-top:.15rem}
.wrap{max-width:560px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:1.1rem;margin-bottom:.9rem;box-shadow:0 4px 14px rgba(90,24,48,.06)}
.hidden{display:none !important}
.numbox{text-align:center}
.numbox .ico{font-size:2.6rem}
.numbox .num{display:inline-block;background:var(--dark);color:var(--gold2);border-radius:50px;padding:.35rem 1.4rem;font-weight:900;font-size:1.3rem;direction:ltr;margin:.5rem 0 .3rem}
.pill{display:inline-block;border-radius:50px;padding:.3rem 1rem;font-size:.8rem;font-weight:900;margin-top:.3rem}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.err{background:var(--errbg);color:var(--err)}
.pill.info{background:#e3f2fd;color:#1565c0}
.note{margin-top:.6rem;background:var(--warnbg);border-radius:10px;padding:.55rem .7rem;font-size:.78rem;font-weight:800;color:var(--warn);line-height:1.8}
.note.err{background:var(--errbg);color:var(--err)}
/* الخطوات */
.steps{display:flex;flex-direction:column;gap:0;margin-top:.4rem}
.step{display:flex;gap:.8rem;position:relative;padding-bottom:1.15rem}
.step:last-child{padding-bottom:0}
.step .rail{position:absolute;top:34px;bottom:0;right:16px;width:3px;background:var(--line);border-radius:3px}
.step:last-child .rail{display:none}
.step.done .rail{background:var(--ok)}
.step .dot{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;background:#fff;border:2px solid var(--line);color:var(--muted);z-index:1}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.now .dot{background:var(--gold);border-color:var(--gold);color:var(--dark);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,145,47,.45)}50%{box-shadow:0 0 0 9px rgba(224,145,47,0)}}
.step .txt b{display:block;font-size:.86rem;font-weight:900;color:var(--muted)}
.step.done .txt b,.step.now .txt b{color:var(--ink)}
/* بطاقات */
.row{display:flex;align-items:center;gap:.7rem;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:.7rem .8rem;margin-top:.6rem}
.row .ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;background:var(--cream)}
.row .inf{flex:1;min-width:0}
.row .inf b{display:block;font-size:.85rem;font-weight:900}
.row .inf small{color:var(--muted);font-size:.7rem;font-weight:700;display:block;line-height:1.6}
.row a.btn{border:none;border-radius:10px;padding:.5rem .8rem;font-family:inherit;font-size:.75rem;font-weight:900;text-decoration:none;white-space:nowrap}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--dark)}
.btn.green{background:var(--ok);color:#fff}
/* الخريطة */
#mapBox{height:230px;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);margin-top:.6rem;z-index:1}
.maplegend{display:flex;gap:.8rem;justify-content:center;font-size:.68rem;font-weight:800;color:var(--muted);margin-top:.5rem;flex-wrap:wrap}
.mk-pin-ico{font-size:26px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
/* الأصناف */
.items h4{font-size:.85rem;font-weight:900;color:var(--brown);margin-bottom:.5rem}
.it{display:flex;justify-content:space-between;gap:.5rem;font-size:.8rem;font-weight:800;padding:.35rem 0;border-bottom:1px dashed var(--line)}
.it:last-of-type{border-bottom:none}
.tot{display:flex;justify-content:space-between;font-size:.82rem;font-weight:800;padding:.25rem 0;color:var(--muted)}
.tot.grand{color:var(--ink);font-size:.95rem;font-weight:900;border-top:1.5px solid var(--line);margin-top:.3rem;padding-top:.5rem}
.auto{text-align:center;color:var(--muted);font-size:.68rem;font-weight:800;margin-top:.8rem}
.load{text-align:center;padding:3rem 1rem;color:var(--muted);font-weight:900}
.spin{display:inline-block;width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:.7rem}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="top">
  <b>🍝 مكرونجي</b>
  <small>تتبع طلبك لحظة بلحظة</small>
</div>

<div class="wrap">
  <div id="box" class="card"><div class="load"><span class="spin"></span><br>جارٍ تحميل طلبك...</div></div>

  <!-- بطاقة الخريطة الثابتة (لا تُعاد تهيئتها) -->
  <div id="mapCard" class="card hidden">
    <b style="font-size:.9rem;font-weight:900;color:var(--brown)">🗺️ خريطة التتبع المباشر</b>
    <div id="mapBox"></div>
    <div class="maplegend">
      <span>🛵 السائق</span><span>📍 وجهتك</span><span>🏪 الفرع</span>
    </div>
  </div>
</div>

<script>
const CLOUD_API = 'https://makaronjy-api.makaronjy.workers.dev';

/* v2.1: 6 دوائر للتوصيل (بدون خطوة تعيين السائق) */
const DELIVERY_STEPS = [
  {s:'pending',         ar:'تم استلام الطلب',   icon:'🧾'},
  {s:'accepted',        ar:'تم قبول الطلب',     icon:'👨🍳'},
  {s:'preparing',       ar:'جاري التحضير',      icon:'🍳'},
  {s:'ready',           ar:'جاهز للتسليم',      icon:'✅'},
  {s:'out_for_delivery',ar:'في الطريق إليك',    icon:'🛵'},
  {s:'delivered',       ar:'تم التسليم',        icon:'🎉'}
];
const PICKUP_STEPS = [
  {s:'pending',   ar:'تم استلام الطلب',            icon:'🧾'},
  {s:'accepted',  ar:'تم قبول الطلب',              icon:'👨‍🍳'},
  {s:'preparing', ar:'جاري التحضير',               icon:'🍳'},
  {s:'ready',     ar:'جاهز للاستلام من الفرع',     icon:'🏪'},
  {s:'delivered', ar:'تم استلام الطلب من الفرع ✅', icon:'🎉'}
];

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function orderNum(){
  const q = new URLSearchParams(location.search).get('order');
  return q ? decodeURIComponent(q) : '';
}
function mapsLink(lat, lng){ return 'https://maps.google.com/?q=' + lat + ',' + lng; }
function fmtTime(t){
  if(!t) return '';
  try{
    const d = new Date(String(t).replace(' ', 'T'));
    return d.toLocaleString('ar-SA', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
  }catch(e){ return String(t).slice(0,16); }
}

/* v2.1: حالة driver_assigned تُعرض كـ "في الطريق" */
function stepsHtml(steps, status){
  const displayStatus = (status === 'driver_assigned') ? 'out_for_delivery' : status;
  const orderIdx = steps.findIndex(x => x.s === displayStatus);
  const finished = (status === 'delivered' || status === 'archived');
  const cur = finished ? steps.length - 1 : orderIdx;
  return '<div class="steps">' + steps.map(function(st, i){
    let cls = 'step';
    if(finished || i < cur) cls += ' done';
    else if(i === cur) cls += ' done now';
    return '<div class="' + cls + '">' +
      '<div class="rail"></div>' +
      '<div class="dot">' + (i <= cur ? '✓' : st.icon) + '</div>' +
      '<div class="txt"><b>' + st.ar + '</b></div>' +
    '</div>';
  }).join('') + '</div>';
}

/* ═══════════════════════════════════════════
   الخريطة الحية (Leaflet)
   ═══════════════════════════════════════════ */
let map = null, mkDriver = null, mkTarget = null, mkBranch = null, lineObj = null, mapFitted = false;

function pinIcon(emoji){
  return L.divIcon({
    className: '',
    html: '<div class="mk-pin-ico">' + emoji + '</div>',
    iconSize: [30, 30],
    iconAnchor: [15, 26]
  });
}
function initMap(){
  if(map || !window.L) return;
  try{
    map = L.map('mapBox', { scrollWheelZoom: false, zoomControl: true });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
  }catch(e){ map = null; }
}
function updateMap(d){
  const card = document.getElementById('mapCard');
  const o = d.order, br = d.branch, dr = d.driver;
  const cancelled = (o.status === 'cancelled');
  if(!window.L || cancelled){ card.classList.add('hidden'); return; }

  const isPickup = (o.order_type === 'pickup');
  const branchPt = (br && typeof br.lat === 'number' && typeof br.lng === 'number') ? [br.lat, br.lng] : null;
  const custPt = (typeof o.customer_lat === 'number' && typeof o.customer_lng === 'number' && o.customer_lat)
    ? [o.customer_lat, o.customer_lng] : null;
  const driverPt = (dr && typeof dr.lat === 'number' && typeof dr.lng === 'number' && dr.lat)
    ? [dr.lat, dr.lng] : null;

  /* طلب استلام: خريطة الفرع فقط */
  if(isPickup){
    if(!branchPt){ card.classList.add('hidden'); return; }
    card.classList.remove('hidden');
    initMap();
    if(!map) return;
    clearMarkers();
    mkBranch = L.marker(branchPt, { icon: pinIcon('🏪') }).addTo(map).bindPopup(esc(br.name || 'الفرع'));
    if(!mapFitted){ map.setView(branchPt, 15); mapFitted = true; }
    return;
  }

  /* توصيل: الوجهة = عنوان العميل وإلا الفرع */
  const targetPt = custPt || branchPt;
  if(!targetPt && !driverPt){ card.classList.add('hidden'); return; }
  card.classList.remove('hidden');
  initMap();
  if(!map) return;

  /* السائق يظهر فقط عندما يوجد موقع حي */
  if(driverPt){
    if(!mkDriver){ mkDriver = L.marker(driverPt, { icon: pinIcon('🛵') }).addTo(map).bindPopup('السائق'); }
    else mkDriver.setLatLng(driverPt);
  } else if(mkDriver){ map.removeLayer(mkDriver); mkDriver = null; }

  /* علامة الوجهة */
  if(targetPt){
    if(!mkTarget){ mkTarget = L.marker(targetPt, { icon: pinIcon(custPt ? '📍' : '🏪') }).addTo(map).bindPopup(custPt ? 'وجهتك' : esc(br.name || 'الفرع')); }
    else mkTarget.setLatLng(targetPt);
  }
  /* علامة الفرع عندما الوجهة هي العميل */
  if(custPt && branchPt){
    if(!mkBranch){ mkBranch = L.marker(branchPt, { icon: pinIcon('🏪') }).addTo(map).bindPopup(esc(br.name || 'الفرع')); }
  } else if(mkBranch && !custPt){ /* لا نكرر علامة الفرع كوجهة */ }

  /* خط المسار المتبقي: سائق ← وجهة */
  if(driverPt && targetPt){
    if(!lineObj){ lineObj = L.polyline([driverPt, targetPt], { color: '#e0912f', weight: 4, dashArray: '10 8', opacity: .85 }).addTo(map); }
    else lineObj.setLatLngs([driverPt, targetPt]);
  } else if(lineObj){ map.removeLayer(lineObj); lineObj = null; }

  /* ضبط الإطار مرة واحدة وعند ظهور السائق أول مرة */
  const pts = [driverPt, targetPt, branchPt].filter(Boolean);
  if(!mapFitted && pts.length){ map.fitBounds(pts, { padding: [36, 36] }); mapFitted = true; }
  else if(driverPt && !mapFitted){ map.setView(driverPt, 14); }
}
function clearMarkers(){
  if(!map) return;
  [mkDriver, mkTarget, mkBranch].forEach(function(mk){ if(mk){ map.removeLayer(mk); } });
  if(lineObj){ map.removeLayer(lineObj); lineObj = null; }
  mkDriver = mkTarget = mkBranch = null;
}

/* ═══════════════════════════════════════════
   العرض
   ═══════════════════════════════════════════ */
function render(d){
  const o = d.order, br = d.branch, dr = d.driver;
  const isPickup = (o.order_type === 'pickup');
  const cancelled = (o.status === 'cancelled');
  const delivered = (o.status === 'delivered' || o.status === 'archived');

  let pillCls = 'info', pillTxt = o.status_text || o.status;
  if(delivered){ pillCls = 'ok'; }
  else if(cancelled){ pillCls = 'err'; }
  else if(o.status === 'ready' || o.status === 'out_for_delivery' || o.status === 'driver_assigned'){ pillCls = 'warn'; }

  let html = '';
  html += '<div class="numbox">' +
    '<div class="ico">' + (cancelled ? '❌' : (delivered ? '🎉' : (isPickup ? '🏪' : '🛵'))) + '</div>' +
    '<div class="num">' + esc(o.number) + '</div>' +
    '<div class="pill ' + pillCls + '">' + esc(pillTxt) + '</div>' +
    '<div style="color:var(--muted);font-size:.7rem;font-weight:800;margin-top:.4rem">' +
      (isPickup ? '🏪 طلب استلام من الفرع' : '🛵 طلب توصيل') + ' • ' + fmtTime(o.created_at) +
    '</div>' +
  '</div>';

  if(cancelled){
    const lastNote = (d.tracking && d.tracking.length) ? d.tracking[d.tracking.length - 1].notes : '';
    html += '<div class="note err">⚠️ ' + esc(lastNote || 'تم إلغاء هذا الطلب') + '</div>';
  }

  if(!cancelled){
    html += '<div style="margin-top:1rem">' + stepsHtml(isPickup ? PICKUP_STEPS : DELIVERY_STEPS, o.status) + '</div>';
  }

  if(!isPickup && dr && dr.name && !delivered && !cancelled){
    html += '<div class="row">' +
      '<div class="ic">🚗</div>' +
      '<div class="inf"><b>' + esc(dr.name) + '</b><small>سائق طلبك' + (dr.last_update ? ' • آخر تحديث ' + fmtTime(dr.last_update) : '') + '</small></div>' +
      (dr.phone ? '<a class="btn green" href="tel:' + esc(dr.phone) + '">📞 اتصال</a>' : '') +
    '</div>';
  }

  if(br && br.name){
    html += '<div class="row">' +
      '<div class="ic">' + (isPickup ? '🏪' : '🍝') + '</div>' +
      '<div class="inf"><b>' + esc(br.name) + '</b><small>' + (isPickup ? 'استلم طلبك من هذا الفرع' : 'فرع تحضير طلبك') + '</small></div>' +
      (br.phone ? '<a class="btn green" href="tel:' + esc(br.phone) + '">📞</a>' : '') +
      ((br.lat && br.lng) ? '<a class="btn gold" href="' + mapsLink(br.lat, br.lng) + '" target="_blank" rel="noopener">🗺️ الوصول</a>' : '') +
    '</div>';
  }

  if(o.items && o.items.length){
    html += '<div class="items" style="margin-top:1rem"><h4>🧾 تفاصيل الطلب</h4>' +
      o.items.map(function(i){
        return '<div class="it"><span>' + i.qty + ' × ' + esc(i.name) + (i.size ? ' (' + esc(i.size) + ')' : '') + '</span><span>' + (i.qty * i.price) + ' ﷼</span></div>';
      }).join('') +
      '<div class="tot" style="margin-top:.5rem"><span>المجموع الفرعي</span><span>' + o.subtotal + ' ﷼</span></div>' +
      (isPickup ? '' : '<div class="tot"><span>رسوم التوصيل</span><span>' + (o.delivery_fee || 0) + ' ﷼</span></div>') +
      '<div class="tot grand"><span>الإجمالي (شامل الضريبة)</span><span>' + o.total + ' ﷼</span></div>' +
      (isPickup ? '<div class="tot"><span>💵 الدفع</span><span>نقداً عند الكاشير</span></div>'
                : '<div class="tot"><span>💵 الدفع</span><span>نقداً للسائق عند التسليم</span></div>') +
    '</div>';
  }

  if(o.notes){ html += '<div class="note">📝 ' + esc(o.notes) + '</div>'; }

  html += '<div class="auto">🔄 تحديث تلقائي كل 15 ثانية — لا تحتاج إعادة تحميل الصفحة</div>';

  const box = document.getElementById('box');
  box.innerHTML = html;
  box.dataset.filled = '1';

  updateMap(d);
}

function renderError(msg){
  document.getElementById('box').innerHTML =
    '<div class="load">😕<br><br>' + esc(msg || 'الطلب غير موجود') + '<br><small style="font-weight:700">تأكد من رقم الطلب أو رابط التتبع</small></div>';
  document.getElementById('mapCard').classList.add('hidden');
}

let timer = null;
async function load(){
  const num = orderNum();
  if(!num){ renderError('لا يوجد رقم طلب في الرابط'); return; }
  try{
    const r = await fetch(CLOUD_API + '/api/track/' + encodeURIComponent(num), { cache:'no-store' });
    const d = await r.json();
    if(!r.ok){ renderError(d.error || 'الطلب غير موجود'); if(timer){ clearInterval(timer); timer = null; } return; }
    render(d);
    if(!timer) timer = setInterval(load, 15000);
  }catch(e){
    const box = document.getElementById('box');
    if(!box.dataset.filled){ renderError('تحقق من اتصالك بالإنترنت'); }
  }
}
document.addEventListener('DOMContentLoaded', function(){ load(); });
</script>
</body>
</html>
<!-- ===== END track.html (v2.1) ===== -->
