# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ─────────────────────────────────────────────
      #  استثناء ملفات الخادم من النشر العام
      #  هذه الملفات لا يحتاجها المتصفح إطلاقاً، وخدمتها
      #  للعامة تكشف بنية القاعدة ومعرّفاتها ومنطق الـAPI.
      #  ⚠️ الحذف من نسخة العمل فقط — المستودع لا يتأثر.
      # ─────────────────────────────────────────────
      - name: Exclude server-side files from public artifact
        run: |
          rm -rf worker
          rm -f wrangler.toml
          rm -f schema.sql
          rm -rf .github
          rm -f .gitignore
          echo "── الملفات المستثناة من النشر ──"
          echo "worker/ · wrangler.toml · schema.sql · .github/ · .gitignore"
          echo "── ما تبقّى (يُنشر) ──"
          ls -1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository (after server-side exclusions above)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
