<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title data-t="driver.pageTitle">بوابة السائق | مكرونجي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--card:#111a2e;--card2:#0f172a;--line:#1e293b;--gold:#f2b95f;--gold2:#e0912f;--maroon:#7f1d3a;--ink:#e2e8f0;--muted:#94a3b8;--ok:#22c55e;--okbg:#14532d;--err:#ef4444;--errbg:#7f1d1d;--wa:#128c5e;--blue:#38bdf8;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:2rem}
.hidden{display:none !important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.2rem}
.login .card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:1.8rem 1.4rem;width:min(400px,94vw);text-align:center}
.login h1{font-size:1.3rem;font-weight:900;color:var(--gold);margin-bottom:.3rem}
.login small{color:var(--muted);font-weight:700;font-size:.75rem;display:block;margin-bottom:1.2rem}
.login input{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:.8rem .9rem;color:var(--ink);font-family:inherit;font-weight:800;font-size:.95rem;margin-bottom:.8rem;outline:none;text-align:center}
.login input:focus{border-color:var(--gold2)}
.login button{width:100%;border:none;border-radius:12px;padding:.9rem;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3b1d0a;font-family:inherit;font-weight:900;font-size:1rem;cursor:pointer}
.login .err{color:#fca5a5;background:var(--errbg);border-radius:10px;padding:.5rem;font-size:.78rem;font-weight:800;margin-top:.7rem;display:none}
header{background:var(--card2);border-bottom:1.5px solid var(--line);padding:.7rem 1rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;row-gap:.4rem;position:sticky;top:0;z-index:20}
header .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
header .nm{flex:1;min-width:0}
header .nm b{display:block;font-size:.95rem;font-weight:900}
header .nm small{color:var(--ok);font-size:.68rem;font-weight:800}
header button.logout{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:.5rem .9rem;font-family:inherit;font-weight:900;font-size:.78rem;cursor:pointer}
.lang-toggle{display:inline-flex;background:#ffffff10;border:1px solid var(--line);border-radius:50px;padding:3px;gap:2px}
.lang-toggle button{padding:.3rem .72rem;border-radius:50px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-weight:900;font-size:.72rem;cursor:pointer}
.lang-toggle button.active{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3b1d0a}
.wrap{max-width:560px;margin:0 auto;padding:1rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1rem}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:.9rem;text-align:center}
.stat b{display:block;font-size:1.5rem;font-weight:900;color:var(--gold)}
.stat small{color:var(--muted);font-weight:800;font-size:.72rem}
h3.sec{font-size:.95rem;font-weight:900;color:var(--gold);margin:.4rem 0 .6rem}
h3.sec .cnt{background:var(--maroon);color:var(--gold);border-radius:50px;padding:.1rem .6rem;font-size:.72rem;font-weight:900;margin-inline-start:.4rem}
.active{background:var(--card);border:2px solid var(--ok);border-radius:20px;padding:1rem;box-shadow:0 0 24px rgba(34,197,94,.25);margin-bottom:1rem}
.active .top{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;margin-bottom:.8rem;align-items:center}
.badge-num{background:var(--maroon);color:var(--gold);border-radius:12px;padding:.35rem .9rem;font-weight:900;font-size:1rem;direction:ltr}
.badge-fee{background:var(--gold2);color:#3b1d0a;border-radius:12px;padding:.35rem .9rem;font-weight:900;font-size:.85rem}
/* ═══ شارة الوقت النسبي + الألوان الذكية ═══ */
.tm{display:inline-flex;align-items:center;font-size:.68rem;font-weight:900;border-radius:50px;padding:.2rem .7rem;background:var(--card2);border:1px solid var(--line);color:var(--muted);direction:ltr;transition:background .4s,color .4s,border-color .4s}
/* 🟢 جديد: أقل من 5 دقائق */
.tm.fresh{background:var(--okbg);border-color:var(--ok);color:#bbf7d0}
/* 🔴 متأخر: أكثر من 30 دقيقة */
.tm.late{background:var(--errbg);border-color:var(--err);color:#fecaca;animation:latePulse 2s infinite}
@keyframes latePulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}}
/* ⚪ عادي: 5-30 دقيقة = الشكل الافتراضي بدون كلاس */
.steps3{display:flex;align-items:center;justify-content:space-between;margin:.6rem .2rem 1rem;direction:ltr}
.st3{display:flex;flex-direction:column;align-items:center;gap:.3rem;flex:0 0 auto;width:64px}
.st3 .ic{width:44px;height:44px;border-radius:50%;background:var(--card2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.15rem;color:var(--muted)}
.st3.done .ic{background:var(--okbg);border-color:var(--ok)}
.st3.now .ic{background:var(--gold2);border-color:var(--gold);animation:pul 1.6s infinite}
@keyframes pul{0%,100%{box-shadow:0 0 0 0 rgba(224,145,47,.5)}50%{box-shadow:0 0 0 10px rgba(224,145,47,0)}}
.st3 small{font-size:.66rem;font-weight:900;color:var(--muted)}
.st3.done small,.st3.now small{color:var(--ink)}
.bar3{flex:1;height:3px;background:var(--line);border-radius:3px;margin:0 2px 22px}
.bar3.done{background:var(--ok)}
.info{display:flex;align-items:center;gap:.5rem;font-size:.85rem;font-weight:800;padding:.35rem 0;flex-wrap:wrap}
.info .lb{color:var(--muted)}
.info a{color:var(--gold);font-weight:900;text-decoration:none}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:.95rem;font-family:inherit;font-weight:900;font-size:.95rem;cursor:pointer;margin-top:.6rem}
.btn.go{background:var(--ok);color:#052e16}
.btn.done{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3b1d0a}
.btn.wa{background:var(--wa);color:#fff}
.btn.sorry{background:var(--err);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted);font-size:.75rem;padding:.6rem}
.pool-card{background:var(--card);border:2px solid var(--blue);border-radius:18px;padding:.9rem;margin-bottom:.8rem;box-shadow:0 0 18px rgba(56,189,248,.18)}
.pool-card.nogps{border-color:var(--gold2);box-shadow:0 0 18px rgba(224,145,47,.18)}
.pc-head{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.5rem}
.pc-dist{background:var(--card2);border:1.5px solid var(--line);color:var(--blue);border-radius:50px;padding:.2rem .8rem;font-size:.75rem;font-weight:900}
.pc-line{font-size:.82rem;font-weight:800;padding:.2rem 0;color:var(--ink);line-height:1.7}
.pc-line .lb{color:var(--muted)}
.pc-warn{background:var(--errbg);color:#fecaca;border-radius:10px;padding:.45rem .7rem;font-size:.75rem;font-weight:900;margin:.4rem 0}
.pc-actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.pc-actions a,.pc-actions button{flex:1;min-width:90px;text-align:center;border:none;border-radius:10px;padding:.6rem .4rem;font-family:inherit;font-weight:900;font-size:.78rem;cursor:pointer;text-decoration:none}
.pca-nav{background:var(--blue);color:#082f49}
.pca-call{background:var(--okbg);color:#bbf7d0;border:1.5px solid var(--ok) !important}
.pca-wa{background:var(--wa);color:#fff}
.pca-claim{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3b1d0a;flex-basis:100%}
.done-card{background:var(--card);border:2px solid var(--gold2);border-radius:16px;padding:.8rem .9rem;margin-bottom:.7rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.done-card .n{background:var(--maroon);color:var(--gold);border-radius:10px;padding:.25rem .7rem;font-weight:900;direction:ltr}
.done-card b{flex:1;font-size:.85rem;font-weight:900}
.done-card button{border:none;border-radius:10px;background:var(--wa);color:#fff;padding:.55rem .9rem;font-family:inherit;font-weight:900;font-size:.78rem;cursor:pointer}
.hist{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:.8rem;margin-top:.6rem}
.hist .row{display:flex;justify-content:space-between;gap:.5rem;font-size:.78rem;font-weight:800;padding:.45rem 0;border-bottom:1px dashed var(--line);align-items:center;flex-wrap:wrap}
.hist .row:last-child{border-bottom:none}
.hist .row .n{color:var(--gold);direction:ltr}
.hist .row .m{color:var(--muted)}
.empty{color:var(--muted);font-weight:800;font-size:.8rem;text-align:center;padding:1.2rem;border:1.5px dashed var(--line);border-radius:14px}
#toast{position:fixed;bottom:1rem;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:.4rem;z-index:99;pointer-events:none}
.tst{background:var(--errbg);color:#fecaca;border-radius:50px;padding:.65rem 1.3rem;font-weight:900;font-size:.8rem;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:92vw;text-align:center}
.tst.ok{background:var(--okbg);color:#bbf7d0}
/* النافذة branded */
.mk-confirm{position:fixed;inset:0;z-index:5200;background:rgba(11,18,32,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:1rem}
.mk-confirm.show{display:flex;animation:mkFade .2s ease}
@keyframes mkFade{from{opacity:0}to{opacity:1}}
.mk-confirm .box{background:linear-gradient(180deg,#1a243a 0%,#111a2e 100%);border:2px solid var(--gold2);border-radius:22px;padding:1.5rem 1.2rem;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:mkPop .25s cubic-bezier(.2,.9,.3,1.3)}
@keyframes mkPop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.mk-confirm .ico{font-size:2.4rem;text-align:center;margin-bottom:.3rem}
.mk-confirm h3{text-align:center;color:var(--gold);font-size:1.05rem;font-weight:900;margin-bottom:.6rem}
.mk-confirm .msg{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem;margin-bottom:.6rem;font-size:.85rem;font-weight:700;color:var(--ink);line-height:1.7;text-align:center}
.mk-confirm .meta{padding:.5rem .7rem;background:rgba(242,185,95,.1);border:1px dashed var(--gold2);border-radius:10px;font-size:.72rem;color:var(--gold2);text-align:center;font-weight:800;margin-bottom:.9rem;direction:ltr}
.mk-confirm .acts{display:flex;gap:.5rem}
.mk-confirm .acts button{flex:1;border:none;border-radius:12px;padding:.8rem;font-family:inherit;font-weight:900;font-size:.88rem;cursor:pointer}
.mk-confirm .btn-yes{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3b1d0a}
.mk-confirm .btn-no{background:var(--card);color:var(--ink);border:1.5px solid var(--line) !important}
.mk-confirm .btn-err{background:var(--err);color:#fff}
</style>
</head>
<body>

<div id="loginScr" class="login">
  <div class="card">
    <h1 data-t="driver.login.title">🚗 بوابة السائق</h1>

<div id="app" class="hidden">

    <div class="lang-toggle">
      <button id="langAr" class="active" onclick="pickLang('ar')">AR</button>

    <h3 class="sec" data-t="driver.sections.currentDelivery">🚗 التوصيل الحالي</h3>
    <div id="activeBox"></div>

    <div id="poolSec">
      <h3 class="sec"><span data-t="driver.sections.availablePool">📦 طلبات متاحة في الفرع</span><span class="cnt" id="poolCnt">0</span></h3>

    </div>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<div id="toast"></div>

<script src="settings.js"></script>
<script src="i18n-staff.js"></script>

<script>
/* ═══════════════════════════════════════════
   مكرونجي — بوابة السائق (v2.5.1)
   الثوابت الصحيحة:
   • REFRESH_MS = 10000  ← بيانات كل 10 ثوانٍ (توفير حصة Worker)
   • TIME_REFRESH_MS = 5000 ← وقت نسبي كل 5 ثوانٍ (محلي مجاني)
   الألوان الذكية: 🟢 <5د | ⚪ 5-30د | 🔴 >30د
   ═══════════════════════════════════════════ */
const API = 'https://makaronjy-api.makaronjy.workers.dev';
const REFRESH_MS = 10000;      // 10 ثوانٍ للتحديث الدوري (بيانات من Worker)
const TIME_REFRESH_MS = 5000;  // 5 ثوانٍ للوقت النسبي (محلي مجاني 100%)

let JWT = localStorage.getItem('mk_driver_jwt') || '';
let ME = null;
try { ME = JSON.parse(localStorage.getItem('mk_driver_me') || 'null'); } catch(e){}
let ORDERS = [];
let POOL = [];
let MY_LOC = null;
let photoForOrder = null;
let LAST_DELIVERED = null;
let MENU_DATA = null;
let MENU_LOADING = null;

/* ═══════════════════════════════════════════
   الزمن النسبي + الألوان الذكية (توقيت الرياض)
   ═══════════════════════════════════════════ */
function parseServerDate(str){
  if(!str) return null;
  let s = String(str);
  if(!s.includes('T') && !s.includes('Z')) s = s.replace(' ', 'T') + 'Z';
  return new Date(s);
}
function timeAgo(date){
  if(!date) return '—';
  const sec = Math.floor((Date.now() - date.getTime()) / 1000);
  const en = isEn();
  if(sec < 5) return en ? 'just now' : 'الآن';
  if(sec < 60) return en ? sec + 's ago' : 'قبل ' + sec + ' ثانية';
  const min = Math.floor(sec / 60);
  if(min < 60){
    if(en) return min + ' min ago';
    if(min === 1) return 'قبل دقيقة';
    if(min === 2) return 'قبل دقيقتين';
    if(min <= 10) return 'قبل ' + min + ' دقائق';
    return 'قبل ' + min + ' دقيقة';
  }
  const hr = Math.floor(min / 60);
  if(hr < 24){
    if(en) return hr + (hr === 1 ? ' hour ago' : ' hours ago');
    if(hr === 1) return 'قبل ساعة';
    if(hr === 2) return 'قبل ساعتين';
    if(hr <= 10) return 'قبل ' + hr + ' ساعات';
    return 'قبل ' + hr + ' ساعة';
  }
  const day = Math.floor(hr / 24);
  if(day === 1) return en ? 'yesterday' : 'أمس';
  if(day < 7) return en ? day + ' days ago' : 'قبل ' + day + ' أيام';
  return date.toLocaleDateString(en ? 'en-GB' : 'ar-SA', {day:'2-digit', month:'short'});
}
/* 🟢 fresh: <5 دقائق | ⚪ '': 5-30 دقيقة | 🔴 late: >30 دقيقة */
function timeClass(date){
  if(!date) return '';
  const sec = (Date.now() - date.getTime()) / 1000;
  if(sec < 300) return 'fresh';
  if(sec < 1800) return '';
  return 'late';
}
function refreshTimeAgo(){
  document.querySelectorAll('.tm[data-time]').forEach(function(elx){
    const dt = parseServerDate(elx.dataset.time);
    if(dt){
      elx.textContent = timeAgo(dt);
      elx.className = 'tm ' + timeClass(dt);
    }
  });
}
function tmBadge(ts){
  const dt = parseServerDate(ts);
  return '<span class="tm ' + timeClass(dt) + '" data-time="' + esc(ts) + '">' + timeAgo(dt) + '</span>';
}

/* ═══════════════════════════════════════════
   ترجمة المنيو (الأصناف القديمة)
   ═══════════════════════════════════════════ */
async function loadMenu(){
  if(MENU_DATA) return MENU_DATA;
  if(MENU_LOADING) return MENU_LOADING;
  MENU_LOADING = (async function(){
    try{
      const r = await fetch('menu.js', { cache:'no-store' });
      if(!r.ok) return [];
      const text = await r.text();
      const match = text.match(/window\.MENU\s*=\s*(\[[\s\S]*?\]);/);
      if(!match) return [];
      try{ return JSON.parse(match[1]); }catch(e){ return []; }
    }catch(e){ return []; }
  })();
  MENU_DATA = await MENU_LOADING;
  return MENU_DATA;
}
function findMenuById(id){
  if(!MENU_DATA || !id) return null;
  for(const sec of MENU_DATA){
    for(const it of sec.items || []){
      if(it.id === id) return it;
    }
  }
  return null;
}
function itemNameL(i){
  const isEnNow = isEn();
  if(isEnNow && i && i.name_en) return i.name_en;
  if(!isEnNow && i && i.name_ar) return i.name_ar;
  if(i && i.id){
    const live = findMenuById(i.id);
    if(live){
      if(isEnNow && live.en) return live.en;
      if(!isEnNow && live.ar) return live.ar;
    }
  }
  return (i ? i.name : '');
}

/* ═══════════════════════════════════════════
   نافذة التأكيد branded
   ═══════════════════════════════════════════ */
let _cfResolve = null;
function confirmModal(msg, opts){
  opts = opts || {};
  return new Promise(function(resolve){
    _cfResolve = resolve;
    document.getElementById('mkCfIco').textContent = opts.icon || '⚠️';
    document.getElementById('mkCfTitle').textContent = opts.title || tt('common.confirm');
    document.getElementById('mkCfMsg').textContent = msg;
    const meta = document.getElementById('mkCfMeta');
    if(opts.meta){ meta.textContent = opts.meta; meta.style.display = ''; }
    else meta.style.display = 'none';
    const yesBtn = document.getElementById('mkCfYes');
    document.getElementById('mkCfNo').textContent = opts.no || tt('common.cancel');
    yesBtn.textContent = opts.yes || tt('common.confirm');
    yesBtn.className = opts.danger ? 'btn-err' : 'btn-yes';
    document.getElementById('mkConfirm').classList.add('show');
  });
}
document.getElementById('mkCfYes').addEventListener('click', function(){
  document.getElementById('mkConfirm').classList.remove('show');
  if(_cfResolve){ const r = _cfResolve; _cfResolve = null; r(true); }
});
document.getElementById('mkCfNo').addEventListener('click', function(){
  document.getElementById('mkConfirm').classList.remove('show');
  if(_cfResolve){ const r = _cfResolve; _cfResolve = null; r(false); }
});

/* ═══════════════════════════════════════════
   ضغط الصور داخلياً قبل الإرسال
   ═══════════════════════════════════════════ */
async function compressImage(file, maxDim, quality){
  maxDim = maxDim || 1000;
  quality = (quality === undefined) ? 0.65 : quality;
  return new Promise(function(resolve, reject){
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function(){
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      canvas.toBlob(function(blob){
        if(!blob) return reject(new Error('compress failed'));
        resolve(blob);
      }, 'image/jpeg', quality);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src = url;
  });
}
function blobToBase64(blob){
  return new Promise(function(resolve, reject){
    const rd = new FileReader();
    rd.onload = function(){ resolve(rd.result); };
    rd.onerror = reject;
    rd.readAsDataURL(blob);
  });
}

function pickLang(lang){ setStaffLang(lang); }
function syncLangUI(){
  const lang = getStaffLang();
  document.getElementById('langAr').classList.toggle('active', lang === 'ar');
  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  if (typeof applyStaffI18n === 'function') applyStaffI18n();
}
function isEn(){ return getStaffLang() === 'en'; }
function cur(){ return tt('common.riyal'); }
function brDisplayName(nameAr){
  if(isEn()){
    try{
      const list = (window.APP_SETTINGS && APP_SETTINGS.branches) || [];
      const b = list.find(x => x.nameAr === nameAr);
      if(b && b.nameEn) return b.nameEn;
    }catch(e){}
  }
  return nameAr || '';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m, ok){
  const d = document.createElement('div');
  d.className = 'tst' + (ok ? ' ok' : '');
  d.textContent = m;
  document.getElementById('toast').appendChild(d);
  setTimeout(()=> d.remove(), 3200);
}
function normalizePhone(p){
  const d = (p || '').replace(/\D/g, '');
  if (d.startsWith('0')) return '966' + d.slice(1);
  if (d.startsWith('966')) return d;
  return d;
}
function trackUrl(number){
  return location.origin + '/track.html?order=' + encodeURIComponent(number);
}
function waOpen(phone, msg){
  const url = 'https://wa.me/' + normalizePhone(phone) + '?text=' + encodeURIComponent(msg);
  const w = window.open(url, '_blank');
  if(!w) location.href = url;
}
function distKm(la1, lo1, la2, lo2){
  const R = 6371, r = x => x * Math.PI / 180;
  const dLa = r(la2 - la1), dLo = r(lo2 - lo1);
  const a = Math.sin(dLa/2)**2 + Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(dLo/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function waThanks(o){

    customer_name: o.customer_name,
    order_number: o.number
  }));
}
function waNoGps(o){
  waOpen(o.customer_phone, tt('messages.drvNoGps', {

  }));

async function api(path, opts){
  opts = opts || {};
  const h = {'Content-Type':'application/json'};
  if(JWT) h['Authorization'] = 'Bearer ' + JWT;
  const r = await fetch(API + path, Object.assign({}, opts, {headers:h}));
  const d = await r.json().catch(()=> ({}));
  if(r.status === 401){ logout(); throw new Error(tt('errors.unauthorized')); }
  if(!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}
function logout(){
  JWT = ''; ME = null;
  localStorage.removeItem('mk_driver_jwt');
  localStorage.removeItem('mk_driver_me');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScr').classList.remove('hidden');
}

/* ===== الدخول ===== */
document.getElementById('btnLogin').addEventListener('click', async function(){
  const u = document.getElementById('inUser').value.trim();
  const p = document.getElementById('inPass').value;
  const errBox = document.getElementById('loginErr');
  errBox.style.display = 'none';
  if(!u || !p){ errBox.textContent = tt('driver.login.errEmpty'); errBox.style.display = 'block'; return; }
  try{
    const d = await api('/api/auth/login', { method:'POST', body: JSON.stringify({username:u, password:p}) });
    if(d.user.role !== 'driver'){ errBox.textContent = tt('driver.login.errNotDriver'); errBox.style.display = 'block'; return; }
    JWT = d.token; ME = d.user;
    localStorage.setItem('mk_driver_jwt', JWT);
    localStorage.setItem('mk_driver_me', JSON.stringify(ME));
    enterApp();
  }catch(e){
    errBox.textContent = e.message || tt('driver.login.errFailed');
    errBox.style.display = 'block';
  }
});
document.getElementById('btnLogout').addEventListener('click', async function(){
  const ok = await confirmModal(tt('driver.confirmLogout'), {
    icon: '🚪', title: tt('common.logout'),
    yes: tt('common.confirm'), no: tt('common.cancel')
  });
  if(ok) logout();
});

function enterApp(){
  document.getElementById('loginScr').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('hName').textContent = ME ? ME.name : '—';
  load();
}

/* ===== التحميل ===== */
async function load(){
  try{
    const [d, p] = await Promise.all([
      api('/api/driver/orders'),
      api('/api/branch/pool')
    ]);
    ORDERS = d.orders || [];
    POOL = p.orders || [];
    if(p.driver_location) MY_LOC = MY_LOC || { lat:p.driver_location.lat, lng:p.driver_location.lng };
    document.getElementById('stCount').textContent = (d.stats && d.stats.delivered_today) || 0;
    document.getElementById('stEarn').textContent = (d.stats && d.stats.earnings_today) || 0;
    renderAll();
  }catch(e){ toast(e.message); }
}
function renderAll(){
  renderActive();
  renderPool();
  renderHist();
  refreshTimeAgo();
}

function activeOrder(){
  return ORDERS.find(o => ['driver_assigned','driver_at_restaurant','out_for_delivery'].includes(o.status)) || null;
}

function itemsLine(items){
  if(!items || !items.length) return '—';
  return items.map(i => (i.qty||1) + '× ' + esc(itemNameL(i)) + (i.size ? ' ('+esc(i.size)+')' : '')).join(' • ');
}

/* ===== بطاقة التوصيل الحالي ===== */
function renderActive(){
  const box = document.getElementById('activeBox');
  const o = activeOrder();
  if(!o){
    box.innerHTML = '<div class="empty">' + tt('driver.empty.noActive') + '</div>';
    return;
  }
  const idx = (o.status === 'driver_assigned' || o.status === 'driver_at_restaurant') ? 0 : (o.status === 'out_for_delivery' ? 1 : 2);
  const steps = [
    {ic:'🚗', t: tt('driver.steps.assigned')},
    {ic:'🛵', t: tt('driver.steps.onTheWay')},
    {ic:'🎉', t: tt('driver.steps.delivered')}
  ];
  let stepsHtml = '<div class="steps3">';
  steps.forEach(function(s, i){
    const cls = i < idx ? 'done' : (i === idx ? 'now' : '');
    stepsHtml += '<div class="st3 ' + cls + '"><div class="ic">' + (i < idx ? '✓' : s.ic) + '</div><small>' + s.t + '</small></div>';
    if(i < steps.length - 1) stepsHtml += '<div class="bar3 ' + (i < idx ? 'done' : '') + '"></div>';
  });
  stepsHtml += '</div>';

  const navLink = (o.customer_lat && o.customer_lng)
    ? '<a href="https://maps.google.com/?q=' + o.customer_lat + ',' + o.customer_lng + '" target="_blank" rel="noopener">🗺️ ' + tt('driver.actions.navigation').replace('🗺️ ','') + '</a>'
    : '';
  let btns = '';
  if(idx === 0){
    btns =
      '<button class="btn go" data-act="go">' + tt('driver.actions.startDelivery') + '</button>' +
      '<button class="btn sorry" data-act="sorry">' + tt('driver.actions.sorry') + '</button>';
  } else if(idx === 1){
    btns =
      '<button class="btn wa" data-act="wa-way">' + tt('driver.actions.onTheWayWaFull') + '</button>' +
      '<button class="btn done" data-act="delivered">' + tt('driver.actions.deliverWithPhoto') + '</button>' +
      '<button class="btn ghost" data-act="delivered-nophoto">' + tt('driver.actions.deliverNoPhoto') + '</button>';
  }
  box.innerHTML =
    '<div class="active">' +
      '<div class="top"><span class="badge-fee">' + tt('driver.info.deliveryFee') + ' ' + (o.delivery_fee || 0) + ' ' + cur() + '</span>' + tmBadge(o.created_at) + '<span class="badge-num">' + esc(o.number) + '</span></div>' +
      stepsHtml +
      '<div class="info">👤 <span class="lb">' + tt('driver.info.customer') + ':</span> ' + esc(o.customer_name) + ' — <a href="tel:' + esc(o.customer_phone) + '">📞 ' + tt('driver.actions.call').replace('📞 ','') + '</a></div>' +
      '<div class="info">📍 <span class="lb">' + tt('driver.info.address') + ':</span> ' + (esc(o.customer_address) || '—') + ' — ' + navLink + '</div>' +
      '<div class="info">🧾 <span class="lb">' + tt('track.items.title') + ':</span> ' + itemsLine(o.items) + '</div>' +
      '<div class="info">💵 <span class="lb">' + tt('driver.info.amountToCollect') + ':</span> ' + o.total + ' ' + cur() + '</div>' +
      btns +
    '</div>';
}

/* ===== الحوض (الأقرب أولاً) ===== */
function sortPool(){
  const ref = MY_LOC;
  POOL.forEach(function(o, i){
    o._hasGps = !!(o.customer_lat && o.customer_lng);
    o._dist = (ref && o._hasGps) ? distKm(ref.lat, ref.lng, o.customer_lat, o.customer_lng) : (o._hasGps ? 50000 + i : Infinity);
  });
  POOL.sort(function(a, b){
    if(a._dist !== b._dist) return a._dist - b._dist;
    return String(a.created_at) < String(b.created_at) ? -1 : 1;
  });
}
function renderPool(){
  const sec = document.getElementById('poolSec');
  const box = document.getElementById('poolBox');
  if(activeOrder()){ sec.classList.add('hidden'); return; }
  sec.classList.remove('hidden');
  sortPool();
  document.getElementById('poolCnt').textContent = POOL.length;
  if(!POOL.length){
    box.innerHTML = '<div class="empty">' + tt('driver.empty.noPool') + '</div>';
    return;
  }
  box.innerHTML = POOL.map(function(o){
    const distBadge = (MY_LOC && o._hasGps)
      ? '<span class="pc-dist">📍 ' + o._dist.toFixed(1) + ' ' + tt('track.map.routeInfo.km') + '</span>'
      : '';
    const navBtn = o._hasGps
      ? '<a class="pca-nav" href="https://maps.google.com/?q=' + o.customer_lat + ',' + o.customer_lng + '" target="_blank" rel="noopener">' + tt('driver.actions.navigation') + '</a>'
      : '';
    const waBtn = o._hasGps
      ? ''
      : '<button class="pca-wa" data-act="wa-nogps" data-id="' + o.id + '">' + tt('driver.actions.wa') + '</button>';
    return '<div class="pool-card' + (o._hasGps ? '' : ' nogps') + '">' +
      '<div class="pc-head"><span class="badge-num">' + esc(o.number) + '</span><span class="badge-fee">💵 ' + o.total + ' ' + cur() + '</span>' + distBadge + tmBadge(o.created_at) + '</div>' +
      '<div class="pc-line">👤 <span class="lb">' + tt('driver.info.customer') + ':</span> ' + esc(o.customer_name) + '</div>' +
      '<div class="pc-line">📍 <span class="lb">' + tt('driver.info.address') + ':</span> ' + (esc(o.customer_address) || '—') + '</div>' +
      '<div class="pc-line">🧾 <span class="lb">' + tt('track.items.title') + ':</span> ' + itemsLine(o.items) + '</div>' +
      (o._hasGps ? '' : '<div class="pc-warn">' + tt('driver.info.noGpsWarning') + '</div>') +
      '<div class="pc-actions">' +
        navBtn +
        '<a class="pca-call" href="tel:' + esc(o.customer_phone) + '">' + tt('driver.actions.call') + '</a>' +
        waBtn +
        '<button class="pca-claim" data-act="claim" data-id="' + o.id + '">' + tt('driver.actions.claim') + '</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

/* ===== السجل + بطاقة آخر تسليم ===== */
function renderHist(){
  const box = document.getElementById('histBox');
  let extra = '';
  if(LAST_DELIVERED){
    extra =
      '<div class="done-card">' +
        '<span class="n">' + esc(LAST_DELIVERED.number) + '</span>' +
        '<b>🎉 ' + tt('driver.lastDelivery.title') + ' — ' + esc(LAST_DELIVERED.customer_name) + '</b>' +
        tmBadge(LAST_DELIVERED.created_at) +
        '<button data-act="wa-thanks">' + tt('driver.lastDelivery.thanks') + '</button>' +
      '</div>';
  }
  const done = ORDERS.filter(o => o.status === 'delivered').slice(0, 15);
  box.innerHTML = extra + (done.length
    ? '<div class="hist">' + done.map(function(o){
        return '<div class="row"><span class="n">' + esc(o.number) + '</span><span>' + esc(brDisplayName(o.branch_name)) + '</span>' + tmBadge(o.created_at) + '<span class="m">' + o.total + ' ' + cur() + '</span></div>';
      }).join('') + '</div>'
    : (extra ? '' : '<div class="empty">' + tt('driver.empty.noHistory') + '</div>'));
}

/* ===== الإجراءات ===== */
async function onAction(e){
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act;
  const id = b.dataset.id ? +b.dataset.id : null;

  if(act === 'wa-thanks'){ if(LAST_DELIVERED) waThanks(LAST_DELIVERED); return; }
  if(act === 'wa-nogps'){
    const o = POOL.find(x => x.id === id);
    if(o) waNoGps(o);
    return;
  }
  if(act === 'claim'){
    try{
      const r = await api('/api/orders/' + id + '/claim', { method:'POST' });
      toast('🤲 ' + r.order_number + ' — ' + tt('driver.steps.assigned'), true);
      load();
    }catch(err){ toast('⚠️ ' + err.message); load(); }
    return;
  }
  if(act === 'wa-way'){ const o = activeOrder(); if(o) waOnWay(o); return; }

  const o = activeOrder();
  if(!o) return;

  try{
    if(act === 'go'){
      await api('/api/orders/' + o.id + '/status', { method:'PUT', body: JSON.stringify({status:'out_for_delivery'}) });
      toast(tt('driver.actions.started'), true);
      load();
    }
    if(act === 'sorry'){
      const ok = await confirmModal(tt('driver.actions.confirmSorry'), {
        icon: '❌',
        title: tt('driver.actions.sorry'),
        yes: isEn() ? 'Confirm decline' : 'نعم، اعتذر',
        no: tt('common.cancel'),
        danger: true,
        meta: '🧾 ' + o.number + ' • ' + o.customer_name
      });
      if(!ok) return;
      await api('/api/orders/' + o.id + '/status', { method:'PUT', body: JSON.stringify({status:'ready', notes:'اعتذار السائق'}) });
      toast(tt('driver.actions.sorryDone'));
      load();
    }
    if(act === 'delivered'){
      photoForOrder = o.id;
      document.getElementById('photoInput').click();
    }
    if(act === 'delivered-nophoto'){
      const ok = await confirmModal(tt('driver.actions.confirmNoPhoto'), {
        icon: '🎉',
        title: tt('driver.actions.deliverNoPhoto'),
        yes: isEn() ? 'Confirm delivery' : 'نعم، تم التسليم',
        no: tt('common.cancel'),
        meta: '🧾 ' + o.number + ' • ' + o.total + ' ' + cur()
      });
      if(!ok) return;
      await api('/api/orders/' + o.id + '/status', { method:'PUT', body: JSON.stringify({status:'delivered'}) });
      LAST_DELIVERED = o;
      toast(tt('driver.actions.deliveredDone'), true);
      load();
    }
  }catch(err){ toast('⚠️ ' + err.message); }
}
document.getElementById('activeBox').addEventListener('click', onAction);
document.getElementById('histBox').addEventListener('click', onAction);
document.getElementById('poolBox').addEventListener('click', onAction);

/* صورة مضغوطة ثم تسليم */
document.getElementById('photoInput').addEventListener('change', async function(){
  const f = this.files && this.files[0];
  this.value = '';
  if(!f || !photoForOrder) return;
  const o = ORDERS.find(x => x.id === photoForOrder) || null;
  let finalBlob = f;
  try{
    finalBlob = await compressImage(f, 1000, 0.65);
    if(finalBlob.size > f.size) finalBlob = f;
  }catch(e){
    finalBlob = f;
  }
  try{
    const b64 = await blobToBase64(finalBlob);
    await api('/api/orders/' + photoForOrder + '/photo', { method:'POST', body: JSON.stringify({photo_base64: b64}) });
    await api('/api/orders/' + photoForOrder + '/status', { method:'PUT', body: JSON.stringify({status:'delivered'}) });
    LAST_DELIVERED = o;
    const compKB = Math.round(finalBlob.size / 1024);
    toast(tt('driver.actions.deliveredWithPhoto') + ' (' + compKB + 'KB)', true);
    photoForOrder = null;
    load();
  }catch(err){ toast('⚠️ ' + err.message); }
});

/* موقع مستمر كل 30 ثانية */
function sendLocation(){
  if(!JWT || !navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function(pos){
    MY_LOC = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    const o = activeOrder();
    fetch(API + '/api/driver/location', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer ' + JWT},
      body: JSON.stringify({
        order_id: o ? o.id : null,
        lat: MY_LOC.lat, lng: MY_LOC.lng
      })
    }).then(function(){ renderPool(); }).catch(function(){});
  }, function(){}, {enableHighAccuracy:true, timeout:8000, maximumAge:15000});
}
setInterval(sendLocation, 30000);

/* المؤقتات: بيانات 10 ثوانٍ (مع إيقاف بالخلفية) + وقت نسبي 5 ثوانٍ */
setInterval(function(){ if(JWT && !document.hidden) load(); }, REFRESH_MS);
setInterval(function(){ if(!document.hidden) refreshTimeAgo(); }, TIME_REFRESH_MS);

window.addEventListener('staff-lang-changed', function(){
  syncLangUI();
  renderAll();
});

initStaffI18n({ autoLangToggle: false });
syncLangUI();

(async function(){
  await loadMenu();
  if(JWT && ME){ enterApp(); } else { logout(); }
})();
